<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}anthive{% endblock %}</title>
    <style>
        :root {
            --bar-bg: #bacacf;
            --bar-text: #333;
            --bar-link: #444;
            --bar-link-hover: #000;
            --link: #2563eb;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --hover: #f1f5f9;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); line-height: 1.5; }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }

        #topbar {
            background: var(--bar-bg);
            color: var(--bar-text);
            padding: 0 16px;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            border-bottom: 1px solid #a8b8be;
        }
        #topbar .brand { font-weight: 600; color: #333; font-size: 13px; text-decoration: none; }
        #topbar .brand:hover { text-decoration: none; color: #000; }
        #topbar nav { display: flex; gap: 14px; }
        #topbar nav > a, #topbar nav .dropdown-toggle { color: var(--bar-link); font-size: 12px; }
        #topbar nav > a:hover, #topbar nav .dropdown-toggle:hover { color: var(--bar-link-hover); text-decoration: none; }

        .dropdown { position: relative; }
        .dropdown-toggle { cursor: pointer; }
        .dropdown-toggle::after { content: ' \25BE'; font-size: 8px; opacity: .5; }
        .dropdown-menu {
            display: none; position: absolute; top: calc(100% + 2px); left: -6px;
            background: #fff; border: 1px solid var(--border); padding: 2px 0;
            min-width: 170px; z-index: 100; box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }
        .dropdown-menu a { display: block; padding: 4px 12px; color: var(--text) !important; font-size: 12px; white-space: nowrap; }
        .dropdown-menu a:hover { background: var(--hover); text-decoration: none; }
        .dropdown:hover .dropdown-menu { display: block; }

        main { padding: 10px 16px; max-width: 1200px; margin: 0 auto; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 5px 8px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
        td { padding: 4px 8px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
        tr:hover td { background: var(--hover); }
        table.narrow { max-width: 480px; }
        table.auto { width: auto; }

        .tbl-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .tbl-controls input[type=text] { padding: 4px 8px; font-family: var(--font); font-size: 12px; border: 1px solid var(--border); background: #fff; color: var(--text); width: 200px; outline: none; }
        .tbl-controls input[type=text]:focus { border-color: var(--link); }
        .tbl-info { font-size: 11px; color: var(--text-muted); }
        .tbl-pg { font-size: 11px; }

        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
        .dot-ok { background: #16a34a; } .dot-warn { background: #ea580c; } .dot-err { background: #dc2626; } .dot-pending { background: #2563eb; }

        .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .breadcrumb a { color: var(--text-muted); }

        .stats-row { display: flex; gap: 16px; margin: 4px 0 8px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
        .stats-row .val { font-weight: 600; color: var(--text); }

        h2 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 2px; }
        code { background: var(--border-light); padding: 1px 4px; font-family: var(--font-mono); font-size: 11px; }

        .md-body { font-size: 13px; line-height: 1.6; }
        .md-body h1, .md-body h2, .md-body h3 { margin: 10px 0 4px; font-size: 14px; font-weight: 600; }
        .md-body p { margin: 4px 0; }
        .md-body table { font-size: 12px; margin: 6px 0; width: auto; }
        .md-body th, .md-body td { padding: 3px 8px; border: 1px solid var(--border); }
        .md-body tr:hover td { background: inherit; }
        .md-body pre { background: var(--border-light); padding: 8px; overflow-x: auto; margin: 4px 0; }
        .md-body ul, .md-body ol { margin: 4px 0 4px 18px; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
        @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
        .mk { color: var(--text-muted); font-size: 11px; width: 90px; white-space: nowrap; }

        .chip { display: inline-block; background: #eef2ff; color: #1d4ed8; border: 1px solid #bfdbfe; padding: 1px 6px; font-size: 11px; margin: 1px 3px 1px 0; text-decoration: none; }
        .chip:hover { background: #dbeafe; text-decoration: none; }
    </style>
    <script>
    function initTable(id,o){o=o||{};var ps=o.pageSize||20,s=o.searchable!==false,t=document.getElementById(id);if(!t)return;var tb=t.querySelector('tbody');if(!tb)return;var c=document.createElement('div');c.className='tbl-controls';t.parentNode.insertBefore(c,t);var si=null;if(s){si=document.createElement('input');si.type='text';si.placeholder='Filter\u2026';si.addEventListener('input',function(){p=0;r()});c.appendChild(si)}var inf=document.createElement('span');inf.className='tbl-info';c.appendChild(inf);var pv=document.createElement('a');pv.className='tbl-pg';pv.href='#';pv.textContent='\u2039 prev';pv.style.display='none';pv.addEventListener('click',function(e){e.preventDefault();p--;r()});c.appendChild(pv);var nx=document.createElement('a');nx.className='tbl-pg';nx.href='#';nx.textContent='next \u203a';nx.style.display='none';nx.addEventListener('click',function(e){e.preventDefault();p++;r()});c.appendChild(nx);var p=0;function r(){var q=si?si.value.toLowerCase().trim():'',a=Array.from(tb.querySelectorAll('tr')),f=q?a.filter(function(r){return r.textContent.toLowerCase().includes(q)}):a,tp=Math.max(1,Math.ceil(f.length/ps));if(p>=tp)p=tp-1;if(p<0)p=0;var st=p*ps;a.forEach(function(r){r.style.display='none'});f.slice(st,st+ps).forEach(function(r){r.style.display=''});var sh=Math.min(ps,f.length-st);inf.textContent=f.length<=ps?f.length+' item'+(f.length!==1?'s':''):(st+1)+'\u2013'+(st+sh)+' of '+f.length;pv.style.display=p>0?'':'none';nx.style.display=p<tp-1?'':'none'}r()}
    </script>
</head>
<body>
    <div id="topbar">
        <a href="/" class="brand">anthive</a>
        <nav>
            <a href="/">datasets</a>
            {% if request.app.state.genesets_available %}
            <a href="/genesets">genesets</a>
            {% endif %}
            <a href="/streamlit">streamlit</a>
            <a href="/api/docs">api</a>
        </nav>
    </div>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
