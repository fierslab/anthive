<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anthive{% endblock %}</title>

    <!-- Pico CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        /* Monospace for data */
        .data-table {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
        }

        /* Status indicators */
        .status-ok { color: #2e7d32; }
        .status-warning { color: #f57c00; }
        .status-error { color: #c62828; }

        /* Compact tables */
        table.compact {
            margin-top: 1rem;
        }
        table.compact td, table.compact th {
            padding: 0.5rem;
        }

        /* Breadcrumb */
        nav.breadcrumb {
            padding: 0.5rem 0;
            font-size: 0.9em;
        }
        nav.breadcrumb a {
            text-decoration: none;
        }
        nav.breadcrumb a:hover {
            text-decoration: underline;
        }

        /* Info dense layout */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .stat-card {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
        }
        .stat-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            color: #666;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
        }

        /* Header styling */
        header.container {
            border-bottom: 1px solid #ddd;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        header nav {
            margin-top: 0.5rem;
        }
        header nav a {
            margin-right: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="container">
        <hgroup>
            <h1>Anthive</h1>
            <p>Single-cell RNA-seq data browser</p>
        </hgroup>
        <nav>
            <a href="/">Datasets</a>
            <a href="/jupyter">JupyterLite</a>
            <a href="/stlite">Streamlit</a>
            <a href="/api/docs">API Docs</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <small>
            Anthive • Single-cell data platform •
            <a href="/api/docs">API</a> •
            <a href="https://github.com/anthropics/claude-code">Built with Claude Code</a>
        </small>
    </footer>
</body>
</html>
