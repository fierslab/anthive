{% extends "base.html" %}

{% block title %}{{ module_name }} — starCAT program{% endblock %}

{% block content %}
<style>
  .sc-ctrls { margin: 8px 0 6px; font-size: 13px; color: var(--text-muted); }
  .sc-ctrls select { font-family: var(--font); font-size: 13px; padding: 3px 7px; border: 1px solid var(--border); border-radius: 5px; }
  .sc-desc { font-size: 13px; line-height: 1.5; margin: 4px 0 2px; max-width: 720px; }
  .sc-group { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: #3730a3; background: #e0e7ff; border-radius: 8px; padding: 1px 8px; vertical-align: middle; margin-left: 6px; }
  .sc-meta { font-size: 12px; color: var(--text-muted); margin: 2px 0; }
  .sc-state { font-size: 13px; color: var(--text-muted); padding: 16px 2px; line-height: 1.55; }
  .sc-state.err { color: #b91c1c; }
  table.wtable { border-collapse: collapse; width: 100%; max-width: 640px; font-size: 13px; }
  table.wtable th, table.wtable td { padding: 3px 8px; border-bottom: 1px solid #eef2f7; text-align: left; }
  table.wtable th { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); }
  table.wtable td.r { color: #94a3b8; text-align: right; width: 34px; font-size: 11px; }
  table.wtable td.w { text-align: right; font-family: var(--font-mono); font-size: 12px; width: 82px; white-space: nowrap; }
  table.wtable td.bar { width: 45%; }
  .wbar { display: inline-block; height: 10px; background: var(--link); border-radius: 2px; vertical-align: middle; min-width: 1px; }
  .wbar.neg { background: #dc2626; }
</style>

<div class="breadcrumb">
    <a href="/genesets">gene sets</a>
    <span class="bc-sep">/</span>
    <a href="/genesets?group=starcat">starCAT</a>
    <span class="bc-sep">/</span>
    {{ catalog_id }}
    <span class="bc-sep">/</span>
    <strong>{{ module_name }}</strong>
</div>

<h1 class="page-title">{{ module_name }}<span class="sc-group" id="sc-group" style="display:none"></span></h1>
<div class="sc-desc" id="sc-desc"></div>
<div class="sc-meta" id="sc-meta"></div>

<div class="sc-ctrls">
    show top
    <select id="sc-top">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
    </select>
    genes by |weight|
    <span class="info" title="starCAT program gene loadings (NMF weights). A high weight means the gene contributes strongly to this program. Note: a gene can load on several programs — a high weight here is not by itself a claim of specificity to this program.">ⓘ</span>
</div>

<div class="sc-state" id="sc-state">loading…</div>
<div id="sc-body" style="display:none">
    <div class="table-wrap">
        <table class="wtable" id="sc-table"></table>
    </div>
</div>

<script>
(function () {
  var CATALOG = {{ catalog_id|tojson }}, MODULE = {{ module_name|tojson }}, API = '/api';
  var topSel = document.getElementById('sc-top'),
      stateEl = document.getElementById('sc-state'),
      bodyEl = document.getElementById('sc-body'),
      table = document.getElementById('sc-table'),
      descEl = document.getElementById('sc-desc'),
      groupEl = document.getElementById('sc-group'),
      metaEl = document.getElementById('sc-meta');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render(d) {
    if (d.group) { groupEl.textContent = String(d.group).replace(/_/g, ' '); groupEl.style.display = ''; }
    descEl.textContent = d.description || '';
    var genes = d.top_genes || [];
    if (!genes.length) {
      metaEl.textContent = '';
      stateEl.className = 'sc-state';
      stateEl.textContent = d.has_weights === false
        ? 'This program has no gene weights in the catalog.'
        : 'No genes returned for this program.';
      bodyEl.style.display = 'none'; return;
    }
    metaEl.textContent = (d.n_genes ? d.n_genes + ' genes in the catalog · ' : '') + 'showing top ' + genes.length + ' by |weight|';

    var maxW = 0;
    genes.forEach(function (g) { var w = (g.weight == null ? 0 : g.weight); maxW = Math.max(maxW, Math.abs(w)); });
    if (!maxW) maxW = 1;
    var rows = genes.map(function (g, i) {
      var w = (g.weight == null ? null : g.weight);
      var pct = w == null ? 0 : Math.abs(w) / maxW * 100;
      var neg = w != null && w < 0;
      return '<tr><td class="r">' + (g.rank != null ? g.rank : (i + 1)) + '</td>'
        + '<td><code>' + esc(g.gene) + '</code></td>'
        + '<td class="w">' + (w == null ? '—' : w.toFixed(4)) + '</td>'
        + '<td class="bar"><span class="wbar' + (neg ? ' neg' : '') + '" style="width:' + pct.toFixed(1) + '%" title="' + (w == null ? '' : w.toFixed(4)) + '"></span></td></tr>';
    }).join('');
    table.innerHTML = '<thead><tr><th class="r">#</th><th>Gene</th><th class="w">Weight</th><th>&nbsp;</th></tr></thead><tbody>' + rows + '</tbody>';
    stateEl.style.display = 'none'; bodyEl.style.display = '';
  }

  function load() {
    var n = topSel.value;
    stateEl.style.display = ''; stateEl.className = 'sc-state'; stateEl.textContent = 'loading…';
    bodyEl.style.display = 'none';
    fetch(API + '/catalogs/starcat/' + encodeURIComponent(CATALOG) + '/modules/' + encodeURIComponent(MODULE) + '?top=' + encodeURIComponent(n), { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 160)); });
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        stateEl.style.display = ''; stateEl.className = 'sc-state err';
        stateEl.textContent = 'could not load — ' + (e && e.message ? e.message : e);
      });
  }

  topSel.addEventListener('change', load);
  load();
})();
</script>
{% endblock %}
