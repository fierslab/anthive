{% extends "base.html" %}

{% block title %}MCP links · anthive admin{% endblock %}

{% block content %}
<style>
  .ml-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px; }
  .ml-head h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .ml-count { font-size: 12px; color: var(--text-muted); }
  .ml-ctrls { margin-left: auto; font-size: 12px; }
  #ml-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #ml-table th, #ml-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #ml-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); font-weight: 600; }
  .ml-user { font-family: var(--font-mono); font-size: 12px; }
  .ml-when { white-space: nowrap; color: var(--text-muted); font-size: 12px; }
  .ml-status { display: inline-block; border-radius: 8px; padding: 1px 8px; font-size: 11px; white-space: nowrap; }
  .ml-status.active  { background: #dcfce7; color: #166534; }
  .ml-status.revoked { background: #f1f5f9; color: #475569; }
  .ml-status.expired { background: #fee2e2; color: #991b1b; }
  .ml-btn { font-family: var(--font); font-size: 12px; padding: 3px 10px; border-radius: 5px;
            border: 1px solid #e7c3c3; background: var(--bg); color: var(--accent-red); cursor: pointer; }
  .ml-btn:disabled { opacity: .5; cursor: default; }
  .ml-state { color: var(--text-muted); font-size: 13px; padding: 16px 2px; }
  .ml-state.err { color: #b91c1c; }
  .ml-ip { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>

{% from "_macros.html" import breadcrumb %}
{{ breadcrumb([("admin", None), ("MCP links", None)]) }}

<div class="ml-head">
  <h1>MCP links</h1>
  <span class="ml-count" id="ml-count"></span>
  <span class="info" title="Every user's personal MCP link. Revoking one stops that link immediately; the user can create a new one from their account menu. Source: GET /admin/mcp-links (admin-gated).">ⓘ</span>
  <span class="ml-ctrls"><label><input type="checkbox" id="ml-show-revoked"> show revoked</label></span>
</div>

<div id="ml-state" class="ml-state">loading…</div>

<div class="table-wrap" id="ml-wrap" style="display:none">
  <table id="ml-table" class="card-table">
    <thead>
      <tr>
        <th>User</th><th>Status</th><th>Created</th><th>Rotated</th>
        <th>Expires</th><th>Last used</th><th>Last IP</th><th></th>
      </tr>
    </thead>
    <tbody id="ml-body"></tbody>
  </table>
</div>

<script>
(function () {
  var stateEl = document.getElementById('ml-state'),
      wrap    = document.getElementById('ml-wrap'),
      bodyEl  = document.getElementById('ml-body'),
      countEl = document.getElementById('ml-count'),
      showRevoked = document.getElementById('ml-show-revoked');
  var rows = [];

  try { showRevoked.checked = (window.antRemember && window.antRemember.get('admin.mcp.show_revoked')) === '1'; } catch (e) {}

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function statusOf(it) {
    if (it.revoked || !it.has_link) return 'revoked';
    if (it.expires_at && new Date(it.expires_at).getTime() < Date.now()) return 'expired';
    return 'active';
  }

  function cell(tr, cls, label, text) {
    var td = document.createElement('td');
    if (cls) td.className = cls;
    if (label) td.setAttribute('data-label', label);
    if (text) td.textContent = text;   // empty stays :empty for the card layout
    tr.appendChild(td);
    return td;
  }

  function render() {
    bodyEl.innerHTML = '';
    var visible = rows.filter(function (it) { return showRevoked.checked || statusOf(it) !== 'revoked'; });
    var active = rows.filter(function (it) { return statusOf(it) === 'active'; }).length;
    countEl.textContent = active + ' active of ' + rows.length;
    if (!visible.length) {
      stateEl.style.display = ''; stateEl.className = 'ml-state';
      stateEl.textContent = rows.length ? 'No active links. Tick "show revoked" to see the rest.' : 'Nobody has created an MCP link yet.';
      wrap.style.display = 'none';
      return;
    }
    stateEl.style.display = 'none'; wrap.style.display = '';
    visible.forEach(function (it) {
      var tr = document.createElement('tr');
      var st = statusOf(it);
      cell(tr, 'card-title ml-user', null, it.user || '?');
      var stTd = cell(tr, null, 'status', '');
      var badge = document.createElement('span'); badge.className = 'ml-status ' + st; badge.textContent = st;
      stTd.appendChild(badge);
      cell(tr, 'ml-when', 'created', fmtDate(it.created));
      cell(tr, 'ml-when', 'rotated', fmtDate(it.rotated_at));
      cell(tr, 'ml-when', 'expires', it.expires_at ? fmtDate(it.expires_at) : (st === 'active' ? 'never' : ''));
      cell(tr, 'ml-when', 'last used', it.last_used ? fmtDate(it.last_used) : (st === 'active' ? 'never used' : ''));
      cell(tr, 'ml-ip', 'last IP', it.last_ip || '');
      var actTd = cell(tr, null, null, '');
      if (st !== 'revoked') {
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'ml-btn'; btn.textContent = 'Revoke';
        btn.addEventListener('click', function () { revoke(it.user, btn); });
        actTd.appendChild(btn);
      }
      bodyEl.appendChild(tr);
    });
  }

  function revoke(user, btn) {
    if (!confirm('Revoke the MCP link of ' + user + '?\n\nTheir clients stop working immediately.')) return;
    btn.disabled = true;
    fetch('/api/admin/mcp-links/' + encodeURIComponent(user), { method: 'DELETE', credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 160)); });
        load();
      })
      .catch(function (e) { btn.disabled = false; alert('Revoke failed. ' + e.message); });
  }

  function load() {
    fetch('/api/admin/mcp-links', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 404) throw new Error('MCP links are not available on this server.');
        if (r.status === 401 || r.status === 403) throw new Error('Not authorized. Admins only.');
        if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 160)); });
        return r.json();
      })
      .then(function (d) { rows = Array.isArray(d) ? d : ((d && d.items) || []); render(); })
      .catch(function (e) {
        stateEl.style.display = ''; stateEl.className = 'ml-state err';
        stateEl.textContent = (e.message && e.message.indexOf('fetch') === -1) ? e.message : 'Could not reach the server.';
        wrap.style.display = 'none';
      });
  }

  showRevoked.addEventListener('change', function () {
    if (window.antRemember) window.antRemember.set('admin.mcp.show_revoked', showRevoked.checked ? '1' : '0');
    render();
  });
  load();
})();
</script>
{% endblock %}
