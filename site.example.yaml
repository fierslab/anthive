# site.example.yaml: one anthive deployment, described in one file.
#
#   bin/ops/ant-stack init            # copy this to site.yaml, create state_dir + secrets
#   $EDITOR site.yaml                 # set paths, hostnames, auth mode
#   bin/ops/ant-stack check           # validate, print the resolved plan
#   bin/ops/ant-stack up              # render + start (docker compose)
#
# site.yaml is site-specific and gitignored. Secrets never go in it: they
# live under <state_dir>/secrets (generated by `init`, 0600).
# Every path here is a HOST path. Data stores are bind-mounted into the
# containers at the same absolute path; nothing from them is copied into an
# image.

site:
  # Compose project name and container prefix. Letters, digits, dash.
  name: anthive
  # What users type into the browser (scheme + host [+ port]). Used for
  # cookies, redirects, MCP links and plot URLs.
  # The address users type. With auth.mode authelia the host must contain a
  # dot or be an IP address (browser cookie rule): anthive.example.org or
  # 10.0.0.5 work, plain "localhost" does not. For a quick local trial use
  # https://127.0.0.1:8443.
  public_url: https://anthive.example.org:8443
  # Extra hostnames/IPs Caddy answers for (tls: internal issues a cert for
  # each). The host of public_url is always included.
  hostnames: [127.0.0.1]

data:
  h5adstore: /srv/anthive/h5adstore        # required
  genesetstore: /srv/anthive/genesetstore  # optional (null disables gene sets)
  starcatstore: null                       # optional
  # Mount the h5adstore read-only into the API (mirror sites that never
  # annotate). Admin editors and annotation writes then fail.
  readonly: false

# Persistent site state: rendered config, secrets, SQLite caches, MCP link
# tokens, Authelia users + db. BACK THIS UP. Created by `init` (0700).
state_dir: /srv/anthive/state

# Host scratch for DuckDB spill, the ant-convert staging area and
# disposable tmp files. null = a docker volume. Put it on fast local disk.
scratch_dir: null

auth:
  # authelia       login portal (Authelia container) with SSO cookies
  # basic          HTTP basic auth at Caddy; users listed below
  # trusted-proxy  an upstream proxy (nginx + SSO) already authenticated the
  #                user and sets Remote-User/Remote-Groups; Caddy must then
  #                only be reachable from that proxy (ports.bind: 127.0.0.1)
  # none           no login; public read-only mirror. Admin features are off.
  mode: authelia
  # Admins by user name (basic mode; in authelia mode admins are the users
  # in the `admins` group, seeded from `users` below).
  admins: [admin]
  # Users seeded at `init` (authelia users_database / basic auth list).
  # Passwords are generated and printed once, or set with
  # `ant-stack passwd <name>`; only hashes are stored.
  users:
    - name: admin
      displayname: Administrator
      email: admin@example.org
      groups: [admins]
  # Authelia only: SMTP for password resets. null = write notifications to
  # <state_dir>/authelia/notification.txt instead of sending mail.
  smtp: null
  #   address: submission://smtp.example.org:587
  #   username: no-reply@example.org
  #   sender: "Anthive <no-reply@example.org>"
  #   (password in <state_dir>/authelia/secrets/smtp)

tls:
  # internal  Caddy's own CA (self-signed; fine for intranets and testing)
  # acme      Let's Encrypt; public_url must be a public DNS name and ports
  #           80 + 443 must reach this host
  # off       plain HTTP; TLS is terminated by an upstream proxy
  mode: internal
  acme_email: null

ports:
  bind: 0.0.0.0     # host address the published port(s) listen on
  https: 8443       # host port for tls internal (acme always uses 443 + 80)
  http: 8500        # host port for tls off

run_as:
  # UID/GID the anthive containers run as. Must be able to read the data
  # stores and own state_dir. null = the user running ant-stack.
  uid: null
  gid: null

images:
  registry: registry.gitlab.kuleuven.be/bdslab/anthive/anthive4
  app: anthive-app
  ingest: anthive-ingest
  tag: latest
  # Leave the defaults unless you mirror these images.
  caddy: caddy:2.11-alpine
  authelia: authelia/authelia:4.39

services:
  mcp: true          # MCP server for AI clients (per-user links)
  chat: false        # in-app assistant, being phased out in favour of MCP: leave off
                     # (key in <state_dir>/secrets/chat_api_key if you do switch it on)

mcp:
  token_ttl_days: 90 # lifetime of a per-user MCP link (0 = never expires)

s3:
  enabled: false
  endpoint: null     # e.g. fsn1.your-objectstorage.com
  region: null
  bucket: null
  prefix: ""
  use_path_style: false
  # Keys: <state_dir>/secrets/s3_access_key_id and s3_secret_access_key

resources:
  server_threads: 8           # DuckDB threads per open dataset (ant-serve)
  server_memory_limit: auto   # per dataset instance; auto = 25% RAM, max 16 GB
  max_open_databases: 48      # LRU cap on open dataset instances
  convert_threads: 4          # ant-convert DuckDB threads (ingest)
  convert_memory_limit: auto  # ant-convert DuckDB memory limit
  plot_cache_max_entries: 256
  catalog_scan: auto          # local | s3 | auto

# Escape hatch: extra keys copied verbatim into the rendered anthive.yaml
# (see anthive.default.yaml for every key). Wins over everything above.
anthive: {}
