# Anthive4 Nginx Configuration — DEV / standalone variant
#
# Post-2026-06 refactor: Caddy is the single source of truth for path
# routing on both dev AND prod. This file demonstrates the prod-shape
# nginx vhost: an SSL terminator + (optional) Authelia gate that
# forwards EVERY anthive path to Caddy on a localhost port.
#
# For an actual production deploy, see:
#   - config/nginx-intern-anthive.conf  — the slim server{} block,
#                                          ready to drop into
#                                          /etc/nginx/sites-enabled/.
#   - doc/DEPLOY.md                     — step-by-step deploy recipe.
#
# THIS file is the standalone-runnable variant for `make serve-nginx`,
# used purely as a development/test substitute for Caddy's :8501
# listener.  It assumes Caddy is running in prod mode on
# 127.0.0.1:8500 (ANTHIVE_PROD=1, ANTHIVE_LISTEN=http://127.0.0.1:8500).
#
# Usage:
#   nginx -c /data/1/users/mark/anthive4/config/nginx.conf \
#         -p /data/1/users/mark/anthive4
#   or:  make serve-nginx

# Run nginx without daemon mode for direct control
daemon off;

# Process/worker settings
worker_processes auto;
error_log nginx_error.log warn;
pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log nginx_access.log combined;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip — Caddy already does this; harmless to repeat for clients that
    # use HTTP/1.0 and a vary path that bypasses Caddy's compressor.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ── Upstream: the Caddy instance running in prod mode ─────────
    # ant-supervisor (with ANTHIVE_PROD=1) launches Caddy bound to
    # 127.0.0.1:8500. ALL paths are owned by Caddy now — nginx no
    # longer routes /api, /browse, /jupyter, /mcp, etc.
    upstream anthive_caddy {
        server 127.0.0.1:8500;
        keepalive 32;
    }

    server {
        listen 8501;
        server_name localhost;

        # WebSocket / SSE upgrade requires HTTP/1.1 + Connection: upgrade
        # at this hop. proxy_http_version 1.1 below handles the rest.
        access_log nginx_access.log;
        error_log nginx_error.log;

        # 1 GB cap so pseudobulk parquet downloads aren't truncated.
        client_max_body_size 1024m;

        # ── Single catch-all: forward everything to Caddy ─────────
        #
        # The reverse-proxy hop is ~1 ms (loopback).  In exchange, the
        # entire path routing (which paths exist, what they map to,
        # what bypasses auth, the /.well-known stubs, the /streamlit
        # 410, …) lives in ONE place: config/Caddyfile.
        #
        # If you need to add a path, change Caddyfile — NOT this file.
        location / {
            proxy_pass http://anthive_caddy;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / Streamable-HTTP (MCP, JupyterLite) upgrade
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # MCP Streamable HTTP responses are SSE-style; do not buffer.
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;

            # NOTE: in the real prod vhost (intern.bdslab.org), Authelia
            # authentication happens at nginx via `auth_request` and
            # the Remote-User / Remote-Groups / Remote-Email headers are
            # forwarded to Caddy.  See config/nginx-intern-anthive.conf
            # for that pattern.  Standalone dev mode here skips auth.
        }

        # Security headers — pass-through to clients (Caddy doesn't add
        # all of these so we belt-and-braces them here).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
