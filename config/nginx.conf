# Anthive4 Nginx Configuration
# Serves static files and proxies API requests
#
# Usage:
#   nginx -c /data/1/users/mark/anthive4/config/nginx.conf -p /data/1/users/mark/anthive4
#   or use: make serve-nginx

# Run nginx without daemon mode for direct control
daemon off;

# Process/worker settings
worker_processes auto;
error_log nginx_error.log warn;
pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log nginx_access.log combined;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Server block
    server {
        listen 8501;
        server_name localhost;

        # Root directory for static files
        root webapp;
        index index.html;

        # Access and error logs
        access_log nginx_access.log;
        error_log nginx_error.log;

        # API reverse proxy - strip /api prefix before forwarding
        location /api/ {
            # Rewrite to strip /api prefix
            rewrite ^/api/(.*) /$1 break;

            # Proxy settings
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;
        }

        # Browser interface - dataset browsing
        location /browse/ {
            proxy_pass http://localhost:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JupyterLite - serve static files
        # COOP/COEP headers are required for SharedArrayBuffer (Pyodide kernel)
        location /jupyter/ {
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            try_files $uri $uri/ =404;
        }

        # MCP server — LLM tool integration (ant-mcp, port 8090)
        # SSE streaming requires proxy_buffering off and a long read timeout.
        #
        # For production (data.nevel.eu) add Basic Auth before the proxy_pass:
        #   auth_basic "Anthive";
        #   auth_basic_user_file /etc/nginx/.htpasswd;
        # Generate .htpasswd with:  htpasswd -c /etc/nginx/.htpasswd <user>
        #
        # Client config (~/.claude/settings.json):
        #   { "mcpServers": { "anthive": { "type": "http",
        #     "url": "https://data.nevel.eu/mcp",
        #     "headers": { "Authorization": "Basic <base64(user:pass)>" } } } }
        location /mcp {
            proxy_pass http://localhost:8090;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for MCP Streamable HTTP (SSE responses)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Streamlit server - includes WebSocket upgrade for live updates
        location /streamlit/ {
            proxy_pass http://localhost:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Home page and browser interface root
        location = / {
            proxy_pass http://localhost:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback - serve static files
        location / {
            try_files $uri $uri/ =404;

            # Cache static assets
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
