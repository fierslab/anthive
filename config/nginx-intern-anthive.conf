# Anthive prod vhost — intern.bdslab.org
#
# Drop into /etc/nginx/sites-available/intern-bdslab.conf and symlink
# into sites-enabled/.  Restart nginx with:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Post-refactor design: nginx is a thin SSL+Authelia shim.  ALL path
# routing lives in Caddy (config/Caddyfile, running locally bound to
# 127.0.0.1:8500 with ANTHIVE_PROD=1 set in its environment).
#
# Other prod vhosts on this host (alzmap.org, data.bdslab.org,
# *.bdslab.org) are independent — they have their own server{} blocks
# and are NOT affected by this file.

# ── Optional: plain HTTP companion that 301s to HTTPS ───────────────
# Standard pattern; safe to keep enabled.
server {
    listen 80;
    listen [::]:80;
    server_name intern.bdslab.org;
    return 301 https://$host$request_uri;
}

# ── Main vhost ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name intern.bdslab.org;

    # TLS — terminate here. Caddy behind us speaks plain HTTP on
    # 127.0.0.1:8500.  Cert path may be a wildcard (recommended) or
    # name-specific; adjust to whatever this host uses.
    ssl_certificate         /etc/nginx/cert/star_bdslab_org.crt;
    ssl_certificate_key     /etc/nginx/cert/star_bdslab_org.key;
    ssl_trusted_certificate /etc/nginx/cert/DigiCertCA.crt;

    # Pseudobulk parquet downloads can be hundreds of MB; allow up to 1 GB.
    client_max_body_size 1024m;

    access_log /var/log/nginx/intern-bdslab-access.log;
    error_log  /var/log/nginx/intern-bdslab-error.log warn;

    # ── Authelia gate ─────────────────────────────────────────────
    # auth_request fires on every location that does NOT opt out
    # (`auth_request off;`).  Authelia returns 200 (allow + sets the
    # Remote-* headers we forward to Caddy) or 401 (denied — we
    # redirect to the portal via the @authelia_redirect block).
    auth_request /internal/authelia-verify;
    error_page 401 = @authelia_redirect;

    auth_request_set $auth_user   $upstream_http_remote_user;
    auth_request_set $auth_groups $upstream_http_remote_groups;
    auth_request_set $auth_name   $upstream_http_remote_name;
    auth_request_set $auth_email  $upstream_http_remote_email;

    # ── Authelia portal — opt out of the gate (this IS the gate). ─
    # /authelia/* is reverse-proxied through Caddy as well, so the
    # login UI lives at the same hostname (intern.bdslab.org/authelia/)
    # the user actually visits.  Caddy then proxies to Authelia on :9091.
    location ^~ /authelia/ {
        auth_request off;
        proxy_pass         http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Uri   $request_uri;
    }

    # Internal endpoint nginx calls via auth_request.
    location = /internal/authelia-verify {
        internal;
        proxy_pass                    http://127.0.0.1:9091/authelia/api/authz/auth-request;
        proxy_pass_request_body       off;
        proxy_set_header              Content-Length        "";
        proxy_set_header              Host                  $host;
        # REQUIRED by the auth-request endpoint.
        proxy_set_header              X-Original-URL        $scheme://$host$request_uri;
        proxy_set_header              X-Original-Method     $request_method;
        proxy_set_header              X-Forwarded-Method    $request_method;
        proxy_set_header              X-Forwarded-Proto     $scheme;
        proxy_set_header              X-Forwarded-Host      $host;
        proxy_set_header              X-Forwarded-Uri       $request_uri;
        proxy_set_header              X-Forwarded-For       $remote_addr;
    }

    # API auth-request variant (returns 401 instead of 302 on unauth) —
    # used if you want to gate API-only paths with the basic-auth-or-cookie
    # split.  Caddy's prod auth snippet currently trusts the headers
    # nginx forwards, so this block is provided for future use.
    location = /internal/authelia-verify-api {
        internal;
        proxy_pass                    http://127.0.0.1:9091/authelia/api/authz/auth-request-api;
        proxy_pass_request_body       off;
        proxy_set_header              Content-Length        "";
        proxy_set_header              Host                  $host;
        proxy_set_header              X-Original-URL        $scheme://$host$request_uri;
        proxy_set_header              X-Original-Method     $request_method;
        proxy_set_header              X-Forwarded-Method    $request_method;
        proxy_set_header              X-Forwarded-Proto     $scheme;
        proxy_set_header              X-Forwarded-Host      $host;
        proxy_set_header              X-Forwarded-Uri       $request_uri;
        proxy_set_header              X-Forwarded-For       $remote_addr;
    }

    # On Authelia 401, redirect to the portal.  Authelia's `rd` query
    # parameter brings the user back to the original URL post-login.
    location @authelia_redirect {
        return 302 https://$host/authelia/?rd=$scheme://$host$request_uri;
    }

    # ── EVERYTHING ELSE → Caddy ───────────────────────────────────
    # Single forward.  Path-level routing lives in config/Caddyfile.
    # The auth_request above runs on this block; Remote-* headers
    # below carry the authenticated identity to Caddy.
    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Streamable-HTTP upgrade (MCP SSE, JupyterLite)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Authenticated identity from Authelia — Caddy's prod auth
        # snippet (config/caddy-auth.prod) trusts these.
        proxy_set_header Remote-User       $auth_user;
        proxy_set_header Remote-Groups     $auth_groups;
        proxy_set_header Remote-Name       $auth_name;
        proxy_set_header Remote-Email      $auth_email;

        # MCP Streamable HTTP / SSE — do not buffer.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Security headers — Caddy doesn't set all of these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-XSS-Protection       "1; mode=block" always;
}
