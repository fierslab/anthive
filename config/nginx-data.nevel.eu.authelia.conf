# data.nevel.eu — anthive4 fronted by Authelia (nginx auth_request).
#
# Replaces the previous HTTP basic-auth gate (auth_basic +
# /etc/nginx/data.passwords) with Authelia at /authelia/.
#
# Apply:
#   sudo cp /data/data_nevel_eu/config/nginx-data.nevel.eu.authelia.conf \
#           /etc/nginx/conf.d/data.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Authelia accepts EITHER a browser session cookie OR an
# `Authorization: Basic <user:pass>` header (antclient / skill),
# both validated against config/authelia/users_database.yml.
#
# Public (no auth): /authelia/ portal, /plots/ (UUID plot images),
# /.well-known/acme-challenge/ (cert renewal). Everything else gated.

server {
    listen 80;
    listen [::]:80;
    server_name data.nevel.eu;

    # Keep ACME http-01 reachable for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name data.nevel.eu;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/data.nevel.eu/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/data.nevel.eu/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/data.nevel.eu.access.log combined;
    error_log  /var/log/nginx/data.nevel.eu.error.log warn;

    client_max_body_size 200m;

    root /data/data_nevel_eu/webapp;

    # ── Authelia gate ──────────────────────────────────────────────────
    # Defined at server level so every location inherits it. Public
    # locations opt out with `auth_request off;`.
    auth_request /internal/authelia-verify;
    error_page 401 = @authelia_redirect;

    # Identity headers exported by Authelia, forwarded to upstreams.
    auth_request_set $auth_user   $upstream_http_remote_user;
    auth_request_set $auth_groups $upstream_http_remote_groups;
    auth_request_set $auth_name   $upstream_http_remote_name;
    auth_request_set $auth_email  $upstream_http_remote_email;

    # Authelia login portal — always reachable, never gated.
    location ^~ /authelia/ {
        auth_request off;
        proxy_pass         http://127.0.0.1:9091/authelia/;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Uri    $request_uri;
    }

    # Browser verify endpoint — cookie-only (auth-request endpoint in
    # Authelia has no header strategy), so stale cached basic-auth from
    # the old gate is ignored instead of banning the user.
    location = /internal/authelia-verify {
        internal;
        proxy_pass                    http://127.0.0.1:9091/authelia/api/authz/auth-request;
        proxy_pass_request_body       off;
        proxy_set_header              Content-Length     "";
        proxy_set_header              Host               $host;
        proxy_set_header              X-Original-URL     $scheme://$host$request_uri;
        proxy_set_header              X-Original-Method  $request_method;
        proxy_set_header              X-Forwarded-Method $request_method;
        proxy_set_header              X-Forwarded-Proto  $scheme;
        proxy_set_header              X-Forwarded-Host   $host;
        proxy_set_header              X-Forwarded-Uri    $request_uri;
        proxy_set_header              X-Forwarded-For    $remote_addr;
    }

    # API verify endpoint — cookie first (logged-in browser XHR), then
    # HTTP basic for programmatic clients (antclient / skill). Maps to
    # Authelia's auth-request-api endpoint. The client Authorization
    # header is forwarded so basic-auth can be validated.
    location = /internal/authelia-verify-api {
        internal;
        proxy_pass                    http://127.0.0.1:9091/authelia/api/authz/auth-request-api;
        proxy_pass_request_body       off;
        proxy_set_header              Content-Length     "";
        proxy_set_header              Host               $host;
        proxy_set_header              Authorization      $http_authorization;
        proxy_set_header              X-Original-URL     $scheme://$host$request_uri;
        proxy_set_header              X-Original-Method  $request_method;
        proxy_set_header              X-Forwarded-Method $request_method;
        proxy_set_header              X-Forwarded-Proto  $scheme;
        proxy_set_header              X-Forwarded-Host   $host;
        proxy_set_header              X-Forwarded-Uri    $request_uri;
        proxy_set_header              X-Forwarded-For    $remote_addr;
    }

    # On 401 from the verify endpoint, send browsers to the portal.
    location @authelia_redirect {
        return 302 https://$host/authelia/?rd=$scheme://$host$request_uri;
    }

    # ACME challenge — public.
    location /.well-known/acme-challenge/ {
        auth_request off;
        root /var/www/html;
    }

    # REST API — gated via the API endpoint (cookie OR HTTP basic).
    # Strips /api prefix before forwarding to :8080.
    location /api/ {
        auth_request /internal/authelia-verify-api;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User       $auth_user;
        proxy_set_header Remote-Groups     $auth_groups;
        proxy_set_header Remote-Email      $auth_email;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    # Plot images — PUBLIC (unguessable UUID filenames); no auth so
    # LLM-generated plot URLs open directly in any browser.
    location /plots/ {
        auth_request off;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "private";
    }

    # Browser interface — gated.
    location /browse/ {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User       $auth_user;
        proxy_set_header Remote-Groups     $auth_groups;
        proxy_set_header Remote-Email      $auth_email;
    }

    # JupyterLite static assets — gated.
    location /jupyter/ {
        try_files $uri $uri/ =404;
    }

    # Home page (browser root) — gated.
    location = / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User       $auth_user;
        proxy_set_header Remote-Groups     $auth_groups;
        proxy_set_header Remote-Email      $auth_email;
    }

    # Static fallback — gated.
    location / {
        try_files $uri $uri/ =404;
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
