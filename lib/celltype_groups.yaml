# Cell type groups for replication counting (audit L33 / L34, partial).
#
# Facet test strata carry the cell type label of their dataset: a Cell
# Ontology name from ant_cell_type ("microglial cell"), a constant for the
# whole dataset, or an author label ("Mic P2RY12", "Astro", "OL-A",
# "Z20/ALL/cluster_Micro"). Replication across cohorts and the
# cross-dataset views in lib/facet_results.py count by the GROUP of a label,
# not by the label itself, so "microglial cell", "Microglia", "MG" and
# "Mic P2RY12" are one cell type. The raw label stays visible on every unit.
#
# Matching (lib/celltype_groups.py): exact label, then the label folded to
# lower case, then the longest matching prefix in `prefixes`; anything else
# is `unmapped`. Unmapped units are listed but never count towards
# replication in a named group.
#
# Built 2026-10-05 from every distinct (cell_type, celltype_source) in
# data/h5adstore/_facet_tests (139 label and source pairs, 123 labels). Confidence per entry:
# high unless a `# medium` comment says otherwise. CL ids are given where
# the group is one Cell Ontology class; mixed groups have none.
#
# Mixed populations get their own group (myeloid (mixed), glia (mixed),
# vascular (mixed), immune (mixed), neuron (mixed)): they are not evidence
# for a pure class. Perivascular / CNS-associated macrophages are not
# microglia. Neuron classes are coarse (excitatory = glutamatergic,
# inhibitory = GABAergic, across regions; cerebellar types included), so a
# replication in "inhibitory neuron" can combine cortical interneurons and
# cerebellar Purkinje cells. Check the raw labels before reading biology
# into a group-level count.

version: 1

groups:
  microglia:
    cl_id: CL:0000129
    cl_label: microglial cell
  perivascular macrophage:
    cl_id: CL:0000881
    cl_label: perivascular macrophage
  macrophage (other):
    cl_id: CL:0000235
    cl_label: macrophage
    note: non-microglial macrophages that are not labelled perivascular (meningeal, unspecified)
  myeloid (mixed):
    cl_id: CL:0000763
    cl_label: myeloid cell
    note: microglia and macrophages together
  immune (mixed):
    note: immune cells of several lineages together
  T cell:
    cl_id: CL:0000084
    cl_label: T cell
  astrocyte:
    cl_id: CL:0000127
    cl_label: astrocyte
  oligodendrocyte:
    cl_id: CL:0000128
    cl_label: oligodendrocyte
  oligodendrocyte precursor cell:
    cl_id: CL:0002453
    cl_label: oligodendrocyte precursor cell
  glia (mixed):
    cl_id: CL:0000125
    cl_label: glial cell
    note: several glial classes together
  excitatory neuron:
    cl_id: CL:0000679
    cl_label: glutamatergic neuron
  inhibitory neuron:
    cl_id: CL:0000617
    cl_label: GABAergic neuron
  dopaminergic neuron:
    cl_id: CL:0000700
    cl_label: dopaminergic neuron
  neuron (mixed):
    cl_id: CL:0000540
    cl_label: neuron
    note: neurons of several classes together, or a class not listed here
  neural progenitor:
    note: neuronal precursors (fetal datasets)
  endothelial cell:
    cl_id: CL:0000115
    cl_label: endothelial cell
  mural cell:
    cl_id: CL:0008034
    cl_label: mural cell
    note: pericytes and vascular smooth muscle cells
  vascular (mixed):
    note: endothelial and mural cells together, or a vascular label that does not resolve
  VLMC / fibroblast:
    cl_id: CL:4023051
    cl_label: vascular leptomeningeal cell
    note: vascular leptomeningeal cells and fibroblasts
  ependymal cell:
    cl_id: CL:0000065
    cl_label: ependymal cell
  choroid plexus epithelial cell:
    cl_id: CL:0000706
    cl_label: choroid plexus epithelial cell
  unmapped:
    note: pooled strata, unknown cells and state clusters that are not a cell type

