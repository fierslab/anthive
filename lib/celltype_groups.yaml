  # microglia
  microglial cell: microglia
  Microglia: microglia
  micro: microglia
  MG: microglia                          # Lee2026 class
  Z20/ALL/cluster_Micro: microglia
  # perivascular / CNS-associated macrophages
  PVM: perivascular macrophage           # Lee2026 class
  perivascular macrophage: perivascular macrophage
  CAMs: perivascular macrophage          # Mathys2023/2024 CNS-associated macrophages; medium
  macrophage: macrophage (other)         # Kamath2022; medium
  meningeal macrophage: macrophage (other)
  # mixed myeloid / immune
  myeloid cell: myeloid (mixed)          # Lee2026 constant over MG + PVM
  Phagocytes: myeloid (mixed)            # Schirmer2019, microglia and macrophages
  Immune: immune (mixed)                 # GreenFujita2024 class
  T cell: T cell
  T cells: T cell
  # astrocytes
  astrocyte: astrocyte
  Astrocytes: astrocyte
  Astro: astrocyte
  astro: astrocyte
  Z20/ALL/cluster_Astro: astrocyte
  Bergmann glial cell: astrocyte         # CL: Bergmann glial cell is_a astrocyte
  # oligodendrocyte lineage
  oligodendrocyte: oligodendrocyte
  Oligo: oligodendrocyte
  oligo: oligodendrocyte
  OL-A: oligodendrocyte
  OL-C: oligodendrocyte
  Z20/ALL/cluster_Oli0: oligodendrocyte
  Z20/ALL/cluster_Oli1: oligodendrocyte
  oligodendrocyte precursor cell: oligodendrocyte precursor cell
  OPC: oligodendrocyte precursor cell
  opc: oligodendrocyte precursor cell
  Z20/ALL/cluster_OPC: oligodendrocyte precursor cell
  # mixed glia
  glial cell: glia (mixed)
  Glia: glia (mixed)                     # GreenFujita2024 class
  Glia-MIX: glia (mixed)                 # Schirmer2019
  MicroOligo: glia (mixed)               # HuukiMyers2024 microglia + oligodendrocytes
  # excitatory neurons
  glutamatergic neuron: excitatory neuron
  excitatory neuron: excitatory neuron
  Excit: excitatory neuron
  exc: excitatory neuron
  EN-PYR: excitatory neuron
  EN-MIX: excitatory neuron
  Z20/ALL/cluster_Ex0: excitatory neuron
  Z20/ALL/cluster_Ex1: excitatory neuron
  granule cell: excitatory neuron        # cerebellar granule cells (Castonguay2026, Aldinger2021); medium
  unipolar brush cell: excitatory neuron # cerebellar, glutamatergic; medium
  # inhibitory neurons
  GABAergic neuron: inhibitory neuron
  GABAergic interneuron: inhibitory neuron
  inhibitory neuron: inhibitory neuron
  inhibitory interneuron: inhibitory neuron
  interneuron: inhibitory neuron         # cerebellar datasets only; medium
  Inhib: inhibitory neuron
  inh: inhibitory neuron
  Z20/ALL/cluster_In: inhibitory neuron
  Purkinje cell: inhibitory neuron       # GABAergic projection neuron; medium (region differs)
  cerebellar Golgi cell: inhibitory neuron
  molecular layer interneuron: inhibitory neuron
  # dopaminergic neurons (Kamath2022 DA subclusters)
  dopaminergic neuron: dopaminergic neuron
  # other neurons
  neuron: neuron (mixed)
  brainstem motor neuron: neuron (mixed)
  cerebellar granule cell precursor: neural progenitor
  # vascular
  endothelial cell: endothelial cell
  capillary endothelial cell: endothelial cell
  endothelial cell of artery: endothelial cell
  endothelial cell of vascular tree: endothelial cell
  vein endothelial cell: endothelial cell
  Endo cells: endothelial cell
  endo: endothelial cell
  Z20/ALL/cluster_Endo: endothelial cell
  Endo_DCN_ABCC9: vascular (mixed)       # Kamath2022; DCN and ABCC9 point to fibroblast / mural cells; medium
  pericyte: mural cell
  smooth muscle cell: mural cell
  perivascular cell: vascular (mixed)    # Clarence2025; does not resolve to one class
  EndoMural: vascular (mixed)            # HuukiMyers2024 endothelial + mural
  vascular leptomeningeal cell: VLMC / fibroblast
  fibroblast: VLMC / fibroblast
  Stromal cells: VLMC / fibroblast       # Schirmer2019; medium
  # other
  ependymal cell: ependymal cell
  choroid plexus epithelial cell: choroid plexus epithelial cell
  # Cell Ontology neuron subtypes (2026-10-07: per-cell ant_cell_type of SEA-AD, Ma2022, Galvao2024, Smajic2022, Lu nuclei)
  L2/3 intratelencephalic projecting glutamatergic neuron: excitatory neuron
  L2/3-6 intratelencephalic projecting glutamatergic neuron: excitatory neuron
  L4 intratelencephalic projecting glutamatergic neuron: excitatory neuron
  L5 intratelencephalic projecting glutamatergic neuron: excitatory neuron
  L6 intratelencephalic projecting glutamatergic neuron: excitatory neuron
  L6 intratelencephalic projecting Car3 glutamatergic neuron: excitatory neuron
  L5 extratelencephalic projecting glutamatergic cortical neuron: excitatory neuron
  L5/6 near-projecting glutamatergic neuron of the primary motor cortex: excitatory neuron
  L6 corticothalamic-projecting glutamatergic cortical neuron: excitatory neuron
  L6b glutamatergic cortical neuron: excitatory neuron
  VIP GABAergic interneuron: inhibitory neuron
  pvalb GABAergic interneuron: inhibitory neuron
  sst GABAergic interneuron: inhibitory neuron
  lamp5 GABAergic interneuron: inhibitory neuron
  sncg GABAergic interneuron: inhibitory neuron
  Lamp5 Lhx6 neuron: inhibitory neuron
  pvalb chandelier GABAergic interneuron: inhibitory neuron
  PAX6 GABAergic interneuron: inhibitory neuron
  sst chodl GABAergic interneuron: inhibitory neuron
  cerebral cortex GABAergic interneuron: inhibitory neuron
  # immune and myeloid labels of the per-cell derives (L32)
  central nervous system macrophage: perivascular macrophage   # CNS-associated macrophages; same group as CAMs
  monocyte: myeloid (mixed)
  conventional dendritic cell: myeloid (mixed)
  plasmacytoid dendritic cell: myeloid (mixed)
  lymphocyte: immune (mixed)
  plasmablast: immune (mixed)
  B cell: immune (mixed)
  natural killer cell: immune (mixed)
  neural cell: neuron (mixed)
  # not a cell type
  all: unmapped                          # Gerrits2021, all cells pooled
  unknown: unmapped
  LC5/VCF/cluster_Alz: unmapped          # LuChen2025 state clusters
  LC5/VCF/cluster_Res: unmapped
  LC5/VNF/cluster_Alz: unmapped
  LC5/VNF/cluster_ND: unmapped
  LC5/VNF/cluster_Res: unmapped

# Label families (longest prefix wins). Applied after the exact labels.
prefixes:
  'Mic ': microglia                      # Mathys2023/2024: Mic P2RY12, Mic TPT1, Mic MKI67, Mic DUSP1
  'EN-': excitatory neuron               # Schirmer2019 layer subtypes
  'IN-': inhibitory neuron               # Schirmer2019 PVALB, SST, SV2C, VIP
  'OL-': oligodendrocyte                 # Schirmer2019
  'Olig_': oligodendrocyte               # Kamath2022
  'OPC_': oligodendrocyte precursor cell # Kamath2022
  'Endo_': endothelial cell              # Kamath2022; medium
  'CALB1_': dopaminergic neuron          # Kamath2022 DA subclusters
  'SOX6_': dopaminergic neuron           # Kamath2022 DA subclusters
