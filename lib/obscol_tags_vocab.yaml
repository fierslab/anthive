  # ── Tags added 2026-10-05 with the closed namespace (decision L1) and the
  #    disease vocabulary split (L17, L19, L21, L22) and donor identity (L5) ──

  treatment:
    label: Treatment
    description: >
      Perturbation applied to the sample in the experiment (drug, stimulus,
      knockdown, vehicle). Usable as an obs tag only.
    # Not a facet, by design (Mark, 2026-10-05): treatments vary too much
    # between experiments to share one column. A dataset publishes its arms
    # as a plain, dataset-local `treatment` column (no `ant_` prefix) with
    # explicit labels: vehicle (saline, DMSO or another vehicle),
    # isotype_control, untreated, unknown_control (arm not described), and
    # the treatment names themselves. The dataset's `.md` names the
    # reference level in `treatment_reference:`. No `facet:` block, so
    # `ant_treatment` is an unregistered (rejected) target.

  cognitive_status:
    label: Cognitive status
    description: >
      Clinical cognitive diagnosis of the donor at the last assessment.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      controlled_values: [NCI, MCI, dementia, other_dementia]
      ordered: false
      summary: Clinical cognitive status of the donor (NCI, MCI, dementia, other_dementia).
      definition: >
        Clinical cognitive diagnosis of the donor, for example the ROSMAP
        consensus diagnosis (cogdx). NCI is no cognitive impairment, MCI is
        mild cognitive impairment, dementia is dementia attributed to AD,
        other_dementia is dementia with another primary cause. This is a
        clinical call; neuropathology is in braak and adnc, and the disease
        facet keeps the study's own diagnosis.
      kind: categorical
      values: "NCI, MCI, dementia, other_dementia"
      missing: Empty (NULL) when not assessed.
      hint_keywords: [cogdx, cognitive, cognition, dcfdx, nci, mci]

  comorbidity:
    label: Comorbidity
    description: >
      Co-occurring neuropathology or disorder recorded next to the main
      diagnosis.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      controlled_values: [DLBD, vascular, SCZ]
      summary: Co-occurring condition next to the main diagnosis (DLBD, vascular, SCZ).
      definition: >
        A second condition of the donor recorded next to the diagnosis in
        the disease facet, for example AD with diffuse Lewy body disease.
        Labels such as AD_DLBD are published as disease AD plus comorbidity
        DLBD. DLBD is diffuse Lewy body disease, vascular is cerebrovascular
        pathology, SCZ is schizophrenia.
      kind: categorical
      values: "DLBD, vascular, SCZ"
      missing: Empty (NULL) when none was recorded or not assessed.
      hint_keywords: [comorbidity, copathology, co_pathology]

  adnc:
    label: AD neuropathologic change
    description: >
      NIA-AA Alzheimer's disease neuropathologic change (ADNC) level of the
      donor. Replaces ad_stage.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      controlled_values: [Not, Low, Intermediate, High]
      ordered: true
      summary: NIA-AA AD neuropathologic change level (Not, Low, Intermediate, High).
      definition: >
        Overall Alzheimer's disease neuropathologic change of the donor from
        the NIA-AA 2012 ABC score (Thal amyloid phase, Braak stage, CERAD
        neuritic plaque score). Ordered Not < Low < Intermediate < High.
        Studies that report another scale (NIA-Reagan, CERAD alone) are
        mapped only where the paper defines the correspondence; the source
        scale is recorded in the dataset's .md.
      kind: categorical
      values: "Not, Low, Intermediate, High (ordered)"
      missing: Empty (NULL) when not assessed, including reference donors that were never scored.
      hint_keywords: [adnc, neuropathological, nia_aa, abc_score]

  donor_uid:
    label: Donor (cross-dataset id)
    description: >
      Identifier of the donor that is the same in every dataset holding
      that person.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: all
      summary: Donor identifier shared across datasets, written <cohort>:<id>.
      definition: >
        The donor written as <cohort>:<id>, for example rosmap:01234567, so
        that the same person carries the same value in every dataset. For
        cohorts in data/h5adstore/donor_crosswalk.tsv it comes from a join on
        that table (obs_derive join form); for other datasets the
        collection's group id stands in for the cohort (template form,
        <group_id>:<donor>). The dataset's own donor labels stay in the
        donor facet. Cross-dataset tools count donors on this column, and on
        <group_id>:<donor> where a dataset has no uid.
      kind: categorical
      values: "<cohort>:<id> (crosswalk cohorts, e.g. rosmap:01234567) or <group_id>:<donor> (template)"
      missing: >
        Empty (NULL) when the donor label is missing, or when a join finds
        no crosswalk entry and the dataset declares no fallback template.
      hint_keywords: []

  app_nlgf:
    label: App NL-G-F knock-in genotype
    description: >
      Whether the host mouse of a xenograft carries the App NL-G-F knock-in
      allele (nlgf) or is the study's control (control). Derived from host_genotype.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [xenograft_human_in_mouse]
      controlled_values: [nlgf, control]
      summary: App NL-G-F knock-in host (nlgf) or the study's control host (control) of a xenograft.
      definition: >
        Genotype of the host mouse of a xenograft (host_genotype): nlgf is the App NL-G-F knock-in amyloid model, control is the
        study's comparison mouse (wild type, or the humanised-App knock-in
        AppHuHu / hApp control of the xenograft studies). Only the NL-G-F
        knock-in counts as nlgf: other amyloid or tau models (APP/PS1, 5xFAD,
        Thy-TAU22, Trem2 or Apoe alleles) are not mapped here, and mice that
        carry NL-G-F combined with a second engineered allele (for example an
        Apoe knockout) stay empty so that the contrast is not confounded.
        The replicate is the animal.
      kind: categorical
      values: "nlgf, control"
      missing: >
        Empty (NULL) when the study has no comparison mouse, when every animal
        is nlgf, or the genotype is a combination with another engineered allele.
      hint_keywords: [nlgf, nl-g-f, app_genotype, mouse_model, mouse_genotype]

# Shared allele vocabulary (2026-10-07, audit L41) for the `genotype` and `host_genotype` facets. Not enforced as controlled
# values; datasets write these tokens so that genotypes compare across studies. A value is one token per locus, several
# loci joined with '; '. `wt` is wild type at every locus listed elsewhere.
allele_vocabulary:
  App:    [App NL-G-F, App hu/hu, App wt]            # mouse host knock-ins: NL-G-F, humanised App, wild type
  APOE:   [APOE e2/e2, APOE e2/e3, APOE e2/e4, APOE e3/e3, APOE e3/e4, APOE e4/e4, APOE KO]   # human cells; Apoe KO for a host
  TREM2:  [TREM2 R47H, TREM2 R62H, TREM2 CV, TREM2 KO]
  PSEN1:  [PSEN1 Int4/Int4, PSEN1 Int4/wt, PSEN1 wt/wt, PSEN1 null/null]
  PSEN2:  [PSEN2 null/null]
  PICALM: [PICALM LOF]
  other:  [wt, karyotype XY, karyotype XX, karyotype XO, karyotype XXY]
