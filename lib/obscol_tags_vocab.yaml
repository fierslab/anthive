# obs-column tag vocabulary — anthive-local, catalog-side annotation.
#
# Purpose
# -------
# Tag each obs column (and, later, each DE contrast) with the biological
# axis-of-variation it describes. A cross-dataset semantic index: querying
# `tag == 'sex'` returns every "sex-carrying" obs column across the
# catalog, regardless of what the column happens to be called
# ('Sex', 'sex', 'donor_sex', 'Sex_donor', ...).
#
# Where the tags live on disk
# ---------------------------
# In the per-dataset `.md` frontmatter, as a dict:
#
#     obs_tags:
#       donor_id: [donor]
#       Braak_stage: [braak]
#       leiden: [cluster]
#       Sex: [sex]
#
# A single column may carry multiple tags (a column that is both a
# donor identifier AND a batch key: `[donor, batch]`).
#
# Scope
# -----
# Anthive-specific. NOT part of the mus joint vocabulary — that's for
# experiment-level metadata (organism, tissue, ...). Obs-column tagging
# is one level finer and lives here.
#
# Starter set
# -----------
# We start deliberately narrow. Extend as concrete cross-dataset queries
# emerge (age, disease_stage, genotype, treatment, batch, region, ...).

version: 1

# Facets
# ------
# A facet is the published `ant_<tag>` obs column that a dataset's `.md`
# declares through `api.obs_rename`, `api.obs_derive` or `api.obs_constant`
# (see doc/DESIGN_canonical_columns.md). The optional `facet:` block under a
# tag is the single source of truth for what that column means in the web
# UI (/facets, /facets/<name>, dataset page) and in the REST API
# (`definition` on GET /facets, GET /facets/{name},
# GET /databases/{id}/facets). Fields:
#
#   summary        one line, shown in lists
#   definition     what the column means, a few sentences
#   kind           categorical | numerical
#   values         unit or controlled vocabulary of the published values
#   missing        how missing / unknown is encoded
#   hint_keywords  lower-case name fragments that suggest an author column
#                  carries this information (used to flag datasets that
#                  could carry the facet but do not). Keywords of three
#                  letters or fewer must match a whole name token.
#
# A tag without a `facet:` block has no published definition yet.
#
# The facet registry (decision L1, 2026-10-04: `ant_*` is a closed namespace)
# --------------------------------------------------------------------------
# These fields under `facet:` make this file the single source of the
# registered facets. `lib/canonical_columns.py` (CANONICAL_TAGS and friends)
# is derived from them and `ant-md-check` rejects an `ant_*` target in a
# dataset's `api:` section whose tag is not registered here.
#
#   status             registered: may be published; deprecated: still
#                      served while datasets migrate, `ant-md-check` warns
#                      and names the replacement. A tag without a status is
#                      not a facet.
#   replaced_by        for deprecated tags, the facets that take over.
#   scope              cross_dataset: values are comparable between
#                      datasets; dataset: labels are local to one dataset.
#   controlled_values  the only values a published column may carry
#                      (NULL aside). Checked by ant-md-check on the values
#                      a map or constant writes.
#   ordered            the controlled values (or numbers) have an order.
#   range              [min, max] for a numerical facet.
#   integer            numerical values must be whole numbers.
#   computed_from      the facet is computed centrally from another facet
#                      when a dataset does not declare it
#                      (`anthive_db.build_obs_view_sql`).
#   facet_scopes       the facet scopes (lib/facet_scopes.py: human_postmortem,
#                      xenograft_human_in_mouse, in_vitro; mouse_in_vivo was retired 2026-10-07) in
#                      which a dataset may publish the facet, or `all`.
#                      `ant md-check` errors when a dataset maps the facet
#                      outside these scopes (facet_scope_mismatch). Facets
#                      are tested and counted per scope, never across scopes.

facet_definitions_status:
  state: under_audit
  note: >
    An audit of the facets is running. These definitions, value
    vocabularies and missing-value rules are drafts and may still change.

tags:
  sex:
    label: Sex
    description: >
      Biological sex of the donor / animal. Column typically carries
      values like 'male' / 'female' / 'M' / 'F' / 'mixed'. Applies to
      per-cell obs when every cell inherits its donor's sex.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: all
      controlled_values: [m, f]
      summary: Biological sex of the donor or animal, coded m or f.
      definition: >
        Sex of the biological subject the cell comes from. Every cell
        inherits its donor's sex. For xenografts this is the graft donor,
        not the host animal (see host_sex). The test of this column in a xenograft is the
        facet test `graft_sex` (one graft line per mouse only).
      kind: categorical
      values: "m (male), f (female)"
      missing: >
        Empty (NULL) when not recorded. Author codes such as 'unknown' or
        'undefined' are hidden to NULL rather than kept as a value.
      hint_keywords: [sex, gender]

  braak:
    label: Braak stage
    description: >
      Neuropathological staging of tau / neurofibrillary-tangle
      distribution (Braak & Braak 1991). Ordinal 0–6 for AD context;
      Braak I–VI in original notation. Also used for α-synuclein Braak
      staging in PD studies. If the column mixes both, split it before
      tagging.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      ordered: true
      range: [0, 6]
      integer: true
      summary: Braak neurofibrillary tangle stage as a number from 0 to 6.
      definition: >
        Neuropathological Braak stage of tau tangle spread (Braak and Braak
        1991) of the donor. Roman numerals and labels such as 'Braak IV'
        are converted to integers.
      kind: numerical
      values: "integer 0 to 6 (0 = no tangles)"
      missing: Empty (NULL) when the stage was not assessed or not reported.
      hint_keywords: [braak]

  cluster:
    label: Cluster
    description: >
      An unsupervised or curated cell-grouping label (leiden, louvain,
      seurat_clusters, cell_type_reclust, ...). Marks the column as
      "this is a grouping of cells" so plot endpoints know to treat it
      as a discrete grouping axis rather than an ordinal covariate.
    facet:
      status: deprecated
      replaced_by: []
      scope: dataset
      facet_scopes: all
      summary: Unsupervised cluster label (leiden, louvain, seurat_clusters).
      definition: >
        A cell grouping produced by clustering. Labels are local to one
        dataset and cannot be compared across datasets.
      kind: categorical
      values: Dataset-specific labels, no shared vocabulary.
      missing: Empty (NULL) for unclustered cells.
      hint_keywords: [cluster, clusters, leiden, louvain]

  age:
    label: Age
    description: >
      Age of the human donor in years: age at death for post-mortem
      cohorts, age at surgery for biopsies. Human datasets only; never the
      age of a mouse or any other animal, and never the host age of a
      xenograft. Binned or categorical author ages ('60-70', 'aged') are not
      mapped to ant_age: keep them as plain columns, or map to a number only
      when the author gives an exact year (for example '90+' to 90, with a
      top-coding caveat in the .md). Applies to per-cell obs when every
      cell inherits its donor's age.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      summary: Age of the human donor in years (post-mortem cohorts, age at death; biopsies, age at surgery).
      definition: >
        Age of the human donor in years when the sample was taken: age at
        death for post-mortem cohorts, age at surgery for biopsies. Human
        datasets only; animal ages, the host age of a xenograft and binned
        or categorical author ages are not mapped to this facet. Every cell
        inherits its donor's age.
      kind: numerical
      values: >
        Years (0 to 120), stored as a number. Ages top-coded by the
        author (89, 90) are kept as given and the .md names the top-coding.
      missing: Empty (NULL) when not recorded.
      hint_keywords: [age, ageatdeath, age_death]

  genotype:
    label: Genotype / model
    description: >
      Genotype of the genome of the SEQUENCED cells themselves: the graft
      line of a xenograft (APOE e4/e4, TREM2 R47H, PICALM LOF) or the donor
      of human tissue (TREM2 R62H carrier). The genotype of the mouse HOST of
      a xenograft is `host_genotype`, never this tag. Distinct from disease
      staging (see 'braak') and from disease-status flags. If a column mixes
      cell genotype, host genotype or disease state, split it before tagging.
      Pure mouse datasets publish no genotype facet (decision 2026-10-07).
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem, xenograft_human_in_mouse, in_vitro]
      summary: Genotype of the sequenced cells' own genome (graft line, donor).
      definition: >
        Genotype of the cells that were sequenced: the graft line of a
        xenograft or the donor of human tissue. The mouse host of a xenograft
        has its own tag, host_genotype. Alleles are written with the shared
        allele vocabulary (see the `allele_vocabulary` block of this file).
      kind: categorical
      values: "Allele tokens of the shared vocabulary, for example APOE e4/e4, TREM2 R47H, wt; several loci joined with '; '."
      missing: Empty (NULL) when not recorded.
      hint_keywords: [genotype, line]

  host_genotype:
    label: Host genotype (xenograft)
    description: >
      For xenograft studies: the genotype of the HOST mouse (for example
      App NL-G-F or the humanised-App control). Kept separate from `genotype`
      (the genome of the sequenced cells), as host_sex is from sex.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [xenograft_human_in_mouse]
      summary: Genotype of the host mouse of a xenograft (App NL-G-F, App hu/hu, wt).
      definition: >
        Genotype of the mouse the human cells are grafted into, written with the
        shared allele vocabulary (`allele_vocabulary`): App NL-G-F knock-in,
        App hu/hu (humanised App control), wt, combinations joined with '; ' (for
        example App NL-G-F; Apoe KO). The genotype of the grafted cells is the
        genotype facet. The app_nlgf facet is derived from this one.
      kind: categorical
      values: "Allele tokens of the shared vocabulary, for example App NL-G-F, App hu/hu, wt."
      missing: Empty (NULL) when the host genotype is not recorded.
      hint_keywords: [host_genotype, mouse_genotype, app_genotype, mouse_model, strain]

  host_sex:
    label: Host sex (xenograft)
    description: >
      For xenograft studies where cells from a human (or other)
      donor are grafted into a host animal: the HOST's sex.
      Kept separate from `sex` — the two tags represent different
      biological subjects. Use `sex` for the donor / biological
      subject, `host_sex` for the graft recipient. If the study
      is not a xenograft, this tag doesn't apply — use `sex`.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [xenograft_human_in_mouse]
      controlled_values: [m, f]
      summary: Sex of the host animal in a xenograft study, coded m or f.
      definition: >
        For cells grafted into a host animal, the host's sex. The donor's
        sex is in the sex facet.
      kind: categorical
      values: "m (male), f (female)"
      missing: Empty (NULL) when not recorded.
      hint_keywords: [host_sex, hostsex, sex_mouse, mouse_sex]

  donor:
    label: Donor
    description: >
      Per-cell identifier of the biological donor / animal / library
      the cell came from — the natural random-effect grouping for
      linear mixed-effects models. Deliberately kept separate from
      'genotype': a donor's genotype is a fixed attribute; the donor
      column itself is a nuisance grouping to control for
      pseudoreplication. Typical column names: 'donor_id',
      'sample_id', 'individualID', 'library', 'orig.ident'.
    facet:
      status: registered
      scope: dataset
      facet_scopes: all
      summary: Identifier of the donor, animal or sample a cell comes from.
      definition: >
        The biological replicate a cell belongs to, the natural grouping
        for pseudobulk and mixed models. Identifiers are only guaranteed
        to be unique within one dataset.
      kind: categorical
      values: Dataset-specific identifiers.
      missing: Empty (NULL) when the donor is not known.
      hint_keywords: [donor, individual, subject, patient, projid, individualid]

  # ── Tags added 2026-10 with facet definitions (canonical tags that had
  #    no vocab entry yet, plus facets in wide use across the store) ──

  braak_group:
    label: Braak group
    description: >
      Braak stage binned into low, medium and high. Derived from the Braak
      stage column of the dataset.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      controlled_values: [low, medium, high]
      ordered: true
      computed_from: braak
      summary: Braak stage binned as low (0 to 2), medium (3 to 4) or high (5 to 6).
      definition: >
        Coarse grouping of the Braak tangle stage. Computed centrally from
        ant_braak (0 to 2 low, 3 to 4 medium, 5 to 6 high) when the dataset
        does not declare it; a declared map must follow the same rule.
      kind: categorical
      values: "low (Braak 0 to 2), medium (3 to 4), high (5 to 6)"
      missing: Empty (NULL) when the Braak stage is missing.
      hint_keywords: [braak]

  ad_stage:
    label: AD neuropathologic change
    description: >
      NIA-AA Alzheimer's disease neuropathologic change (ADNC) level of the
      donor.
    facet:
      status: deprecated
      replaced_by: [adnc]
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      summary: NIA-AA AD neuropathologic change level (control, low, intermediate, high).
      definition: >
        Overall Alzheimer's disease neuropathologic change of the donor
        (NIA-AA 2012 ABC score summary). 'Not AD' and reference donors map
        to control.
      kind: categorical
      values: "control, low, intermediate, high"
      missing: Empty (NULL) when not assessed.
      hint_keywords: [adnc, neuropathological, cerad, thal]

  apoe:
    label: APOE genotype
    description: >
      APOE allele pair of the donor.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem, xenograft_human_in_mouse]
      controlled_values: [E2/E2, E2/E3, E2/E4, E3/E3, E3/E4, E4/E4]
      summary: APOE genotype of the donor, written E3/E4 (lower allele first).
      definition: >
        The donor's two APOE alleles. Author notations such as '34', 'e3e4'
        or 'APOE3/4' are rewritten to the shared form.
      kind: categorical
      values: "E2/E2, E2/E3, E2/E4, E3/E3, E3/E4, E4/E4"
      missing: Empty (NULL) when not genotyped.
      hint_keywords: [apoe]

  apoe4_carrier:
    label: APOE e4 carrier
    description: >
      Whether the donor carries at least one APOE e4 allele (E4+), or none (E4-).
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      controlled_values: [E4+, E4-]
      computed_from: apoe
      summary: APOE e4 carrier status (E4+ or E4-), derived from the APOE genotype.
      definition: >
        E4+ when the donor carries at least one APOE e4 allele, E4- when
        it carries none. Computed centrally from ant_apoe (any E4 allele
        gives E4+) when the dataset does not declare it.
      kind: categorical
      values: "E4+, E4-"
      missing: Empty (NULL) when the APOE genotype is missing.
      hint_keywords: [apoe]

  apoe_carrier:
    label: APOE e4 carrier (deprecated name)
    description: >
      Deprecated name of apoe4_carrier, kept as an alias for one release.
    facet:
      status: deprecated
      replaced_by: [apoe4_carrier]
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      summary: Deprecated name of ant_apoe4_carrier (E4+ or E4-).
      definition: >
        Deprecated alias of ant_apoe4_carrier: carries at least one APOE e4
        allele (E4+) or none (E4-).
      kind: categorical
      values: "E4+, E4-"
      missing: Empty (NULL) when the APOE genotype is missing.

  disease:
    label: Disease
    description: >
      Disease or diagnosis of the donor.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      summary: Diagnosis of the donor as a short code (AD, control, MCI, PD, MS, ...).
      definition: >
        Clinical or neuropathological diagnosis of the donor the cell comes
        from. Non-diseased donors are 'control'.
      kind: categorical
      values: >
        Short codes, for example AD, control, MCI, PD, ALS, MS, FTD, HD.
        Not yet fully harmonised: 'normal' and 'NCI' still occur next to
        'control'.
      missing: Empty (NULL) when not recorded.
      hint_keywords: [disease, diagnosis, dx, diag, pathology]

  condition:
    label: Condition
    description: >
      Experimental condition or treatment of the sample.
    facet:
      status: deprecated
      replaced_by: [disease, genotype]
      scope: dataset
      facet_scopes: all
      summary: Experimental condition or treatment of the sample.
      definition: >
        What was done to the sample in the experiment (treatment, stimulus,
        time point). Disease of the donor belongs in the disease facet.
        Treatment arms go to a plain dataset-local `treatment` column, not
        a facet.
      kind: categorical
      values: Dataset-specific labels, no shared vocabulary.
      missing: Empty (NULL) when not recorded.
      hint_keywords: [condition, treatment, stimulus, stim]

  pmi:
    label: Post-mortem interval
    description: >
      Time between death and tissue preservation.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      range: [0, 1000]
      summary: Post-mortem interval in hours.
      definition: >
        Time between death of the donor and freezing or fixation of the
        tissue.
      kind: numerical
      values: Hours.
      missing: Empty (NULL) when not recorded.
      hint_keywords: [pmi, postmortem, post_mortem]

  region:
    label: Region
    description: >
      Brain region or sub-region the sample was taken from.
    facet:
      status: deprecated
      replaced_by: [tissue]
      scope: cross_dataset
      facet_scopes: all
      summary: Retired 2026-10-07 (decision L38); the coarse region is tissue, the specific one tissue_uberon.
      definition: >
        Retired. The region information is in the coarse facet tissue and
        in the plain column tissue_uberon (most specific UBERON term).
      kind: categorical
      values: Free-text region names, not yet a controlled vocabulary.
      missing: Empty (NULL) when not recorded.
      hint_keywords: [region, area, brain_region, location]

  tissue:
    label: Tissue
    description: >
      Coarse brain region of the sample (umbrella terms such as prefrontal cortex).
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: [human_postmortem]
      controlled_values: [prefrontal cortex, cingulate cortex, frontal cortex, motor cortex, temporal cortex, parietal cortex, occipital cortex, insular cortex, entorhinal cortex, hippocampus, cerebral cortex, white matter, basal ganglia, thalamus, midbrain, cerebellum, brainstem, hypothalamus, spinal cord, olfactory bulb, brain]
      summary: Coarse brain region (umbrella term), comparable across datasets.
      definition: >
        Coarse anatomical group of the sample, from the table in
        lib/tissue_groups.yaml: every prefrontal subdivision (dorsolateral
        prefrontal cortex BA9/46, frontal pole BA10, superior frontal gyrus)
        is "prefrontal cortex", anterior cingulate is "cingulate cortex",
        every white matter label is "white matter", and so on. The most
        specific UBERON term of a dataset is in the plain columns
        tissue_uberon and tissue_uberon_id, which are never facets.
        Xenograft, in vitro and organoid datasets have no tissue facet.
      kind: categorical
      values: "Group terms of lib/tissue_groups.yaml, for example 'prefrontal cortex', 'temporal cortex', 'hippocampus'."
      missing: Empty (NULL) when not recorded or not mappable (for example a layer or a tumour label).
      hint_keywords: [tissue, region, area, brain_region, location]

  cell_type:
    label: Cell type
    description: >
      Broad, harmonised cell class of the cell.
    facet:
      status: registered
      scope: cross_dataset
      facet_scopes: all
      summary: Broad cell class with Cell Ontology labels (microglial cell, astrocyte, ...).
      definition: >
        Harmonised broad cell class. Single-cell-type datasets publish it
        as a constant; others map the authors' annotation onto it.
      kind: categorical
      values: "Cell Ontology labels, for example 'microglial cell', 'astrocyte', 'excitatory neuron'."
      missing: "'unknown' for cells the authors left unassigned; empty (NULL) when not recorded."
      hint_keywords: [celltype, cell_type, cellclass, class, annotation]

  author_cell_type:
    label: Author cell type
    description: >
      The authors' own cell-type annotation, kept as published.
    facet:
      status: deprecated
      replaced_by: []
      scope: dataset
      facet_scopes: all
      summary: Retired 2026-10-07 (decision L35); the columns stay as plain obs columns.
      definition: >
        Cell-type annotation as published by the authors, kept for
        reference next to the harmonised cell_type facet.
      kind: categorical
      values: Dataset-specific labels.
      missing: Empty (NULL) when not annotated.
      hint_keywords: [celltype, cell_type, annotation, subtype]

  author_cluster:
    label: Author cluster (retired)
    description: >
      The authors' clusters, kept as published. Retired as a facet on 2026-10-07 (decision L35):
      clusters are only meaningful inside one cell type, see the per-cell-type author cluster facets.
    facet:
      status: deprecated
      replaced_by: [mg_author_cluster, astro_author_cluster, oligo_author_cluster, opc_author_cluster, exn_author_cluster, inn_author_cluster, endo_author_cluster]
      scope: dataset
      dataset_scoped: true
      facet_scopes: all
      summary: Retired 2026-10-07; replaced by one author cluster facet per cell type group.
      definition: >
        Retired. A cluster label is only comparable inside one cell type of one dataset. The author columns stay
        as plain obs columns; the clusters that nest inside one cell type are published as
        ant_<group>_author_cluster (mg, astro, oligo, opc, exn, inn, endo).
      kind: categorical
      values: Dataset-specific labels.
      missing: Empty (NULL) for cells without a cluster.
      hint_keywords: [cluster, clusters, leiden, louvain, state, subcluster]

  mg_author_cluster:
    label: Author cluster (microglia)
    description: >
      The authors' finest clustering inside the microglia population of one dataset, kept as published.
    facet:
      status: registered
      scope: dataset
      dataset_scoped: true
      facet_scopes: all
      summary: The authors' clusters or states of the microglia population, local to each dataset.
      definition: >
        Cluster or cell-state labels of microglia cells as published by the authors, written
        <db_id>/cluster_<label>. Dataset-scoped by definition: labels are never compared across datasets.
        Published only where the authors' clusters nest inside this one cell type (a single-cell-type dataset, or a
        mixed dataset whose clusters belong to one cell type; cells of other types are empty). No gene tests run
        on it; a per-donor cluster composition analysis is planned.
      kind: categorical
      values: Dataset-specific labels.
      missing: Empty (NULL) for cells without a cluster or of another cell type.
      hint_keywords: [mg_cluster]

  astro_author_cluster:
    label: Author cluster (astrocyte)
    description: >
      The authors' finest clustering inside the astrocyte population of one dataset, kept as published.
    facet:
      status: registered
      scope: dataset
      dataset_scoped: true
      facet_scopes: all
      summary: The authors' clusters or states of the astrocyte population, local to each dataset.
      definition: >
        Cluster or cell-state labels of astrocyte cells as published by the authors, written
        <db_id>/cluster_<label>. Dataset-scoped by definition: labels are never compared across datasets.
        Published only where the authors' clusters nest inside this one cell type (a single-cell-type dataset, or a
        mixed dataset whose clusters belong to one cell type; cells of other types are empty). No gene tests run
        on it; a per-donor cluster composition analysis is planned.
      kind: categorical
      values: Dataset-specific labels.
      missing: Empty (NULL) for cells without a cluster or of another cell type.
      hint_keywords: [astro_cluster]

  oligo_author_cluster:
    label: Author cluster (oligodendrocyte)
    description: >
      The authors' finest clustering inside the oligodendrocyte population of one dataset, kept as published.
    facet:
      status: registered
      scope: dataset
      dataset_scoped: true
      facet_scopes: all
      summary: The authors' clusters or states of the oligodendrocyte population, local to each dataset.
      definition: >
        Cluster or cell-state labels of oligodendrocyte cells as published by the authors, written
        <db_id>/cluster_<label>. Dataset-scoped by definition: labels are never compared across datasets.
        Published only where the authors' clusters nest inside this one cell type (a single-cell-type dataset, or a
        mixed dataset whose clusters belong to one cell type; cells of other types are empty). No gene tests run
        on it; a per-donor cluster composition analysis is planned.
      kind: categorical
      values: Dataset-specific labels.
      missing: Empty (NULL) for cells without a cluster or of another cell type.
      hint_keywords: [oligo_cluster]

  opc_author_cluster:
    label: Author cluster (oligodendrocyte precursor cell)
    description: >
      The authors' finest clustering inside the oligodendrocyte precursor cell population of one dataset, kept as published.
    facet:
      status: registered
      scope: dataset
      dataset_scoped: true
      facet_scopes: all
      summary: The authors' clusters or states of the oligodendrocyte precursor cell population, local to each dataset.
      definition: >
        Cluster or cell-state labels of oligodendrocyte precursor cell cells as published by the authors, written
        <db_id>/cluster_<label>. Dataset-scoped by definition: labels are never compared across datasets.
        Published only where the authors' clusters nest inside this one cell type (a single-cell-type dataset, or a
        mixed dataset whose clusters belong to one cell type; cells of other types are empty). No gene tests run
        on it; a per-donor cluster composition analysis is planned.
      kind: categorical
      values: Dataset-specific labels.
      missing: Empty (NULL) for cells without a cluster or of another cell type.
      hint_keywords: [opc_cluster]

  exn_author_cluster:
    label: Author cluster (excitatory (glutamatergic) neuron)
    description: >
      The authors' finest clustering inside the excitatory (glutamatergic) neuron population of one dataset, kept as published.
    facet:
