# Tissue groups for the ant_tissue facet (decision 2026-10-07, L37/L38).
#
# ant_tissue is a COARSE facet: every specific anatomical label of a dataset maps to one of the group terms below
# (the keys of `groups`). The most specific UBERON label stays in the plain columns tissue_uberon (label) and
# tissue_uberon_id; those two are never facets. A label belongs to exactly one group. Umbrella rules:
#   prefrontal cortex  = dorsolateral prefrontal cortex (BA9/46), frontal pole (BA10), BA9, BA46, superior frontal gyrus
#   cingulate cortex   = anterior cingulate cortex (kept apart from the prefrontal umbrella)
#   frontal cortex     = frontal lobe or frontal cortex when the authors do not say which part
#   cerebral cortex    = cortex without any lobe or area (a whole-cortex dissection or an unspecified sample)
#   white matter       = every white matter label regardless of lobe (spinal cord white matter is spinal cord)
#   basal ganglia      = striatum and caudate nucleus; midbrain = midbrain and substantia nigra
# Xenograft, in vitro and organoid datasets have no tissue facet (decision L39). Ids come from the UBERON release
# 2026-10-01; occipitotemporal cortex has no UBERON term (id null).
version: 1
groups:
  prefrontal cortex:
    - {label: "prefrontal cortex", uberon_id: "UBERON:0000451"}
    - {label: "dorsolateral prefrontal cortex", uberon_id: "UBERON:0009834"}
