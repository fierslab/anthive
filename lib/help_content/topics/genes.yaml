body_html: |
  <ul>
    <li><strong>Genes.</strong> Open <a href="/genes">genes</a> in the top bar and type a gene to see it across all datasets; several genes separated by commas give a heatmap. Favourite genes (set in Preferences) are marked.</li>
    <li><strong>Reading the bars and dots.</strong> In the dataset Genes tab and in the Expression tab of a gene or gene set page, each value is a bar from 0 to 100 percent with the number to the right: <em>Cells expressing (%)</em> is the percent of cells with at least one count, and <em>Rank among genes (%)</em> is the percent of genes detected in the dataset whose average expression over all cells (cells without a count counted as zero) is lower than that of this gene. It compares genes, not cells, and values below about 50% mostly mean the gene is barely expressed. The baseline depends on how many genes a dataset kept, so ranks are compared within one dataset, never as a shared scale. In the gene atlas and the gene set variability tables each value is a big dot on a thin grey line instead: the position is the value on that statistic's range, and the colour shows the low (red), middle (amber) or high (green) third.</li>
    <li><strong>Gene sets</strong> (<a href="/genesets">/genesets</a>): type part of a name in the search box on top to find a gene set at once (it matches the display name, the module name and the study/experiment, and shows how many sets match), or browse curated gene sets by study and experiment, open one to see its genes and where its module score varies most, or look up every set containing a gene. The <a href="/genesets/variability">variability heatmap</a> compares modules across datasets; its numbers are <em>per-cell associations (descriptive)</em>, computed over cells and not over donors (see <a href="#per-cell-per-donor">Per cell vs per donor</a>).</li>
    <li><strong>Module scores</strong> are computed per cell with scanpy (default) or UCell; choose the method in Preferences.</li>
    <li><strong>Preview marker.</strong> Views that have not been reviewed yet (the facets pages, donor groups, gene set variability and the tabs of a gene or gene set page other than Expression) are greyed and marked <em>preview</em>. They stay fully usable; the marker says the view is still being reviewed and results may change.</li>
    <li><strong>Facets browser</strong> (<a href="/facets">/facets</a>, marked <em>preview</em>): every facet with how many datasets carry it, its definition and its donor-level effects across datasets. Each dataset has a <strong>Facets</strong> tab with the same information for that dataset. It is experimental: numbers and groupings may still change.</li>
  </ul>
