aliases:
- facet overview
- facet page overview
body_html: |
  <p>The <strong>Overview</strong> tab of a facet page opens with one sentence, for example how many genes change with Braak stage in microglia in the same direction in at least 2 cohorts (FDR 5 percent) with at least a 10 percent change, and how many of those also pass the strict minimum-effect test. Below it come one line per cell type with a hit, a single line for the cell types without one (usually tested in two cohorts only, so with little power), the replicated genes of the main cell type listed once, the replicated gene sets, and the cohorts with their donors and covariates. One caveat line says what the number does not mean: a whole cell type can change because the mix of states inside it changes, and Braak stage and pathologic AD are one pathology axis.</p>
  <p>The expert details are closed by default. They hold the counts per tier and cell type (uncapped), the cohort table with the counted cohorts first and the others in grey, the genomic inflation lambda where the API serves it, and the full replication rule. The older Detail tab keeps the effects per dataset and cell type, the value distribution and the datasets that carry the facet.</p>
