body_html: |
  <p>A facet page opens on <strong>Overview</strong>; the earlier <strong>Detail (old)</strong> page sits in the <strong>Older views</strong> menu (addresses #overview and #detail). The Overview opens with one sentence, for example how many genes change with Braak stage in microglia in the same direction in at least 2 cohorts (FDR 5 percent) with at least a 10 percent change, and how many of those also pass the strict minimum-effect test. One caveat line says what the number does not mean: a whole cell type can change because the mix of states inside it changes, and Braak stage and pathologic AD are one pathology axis.</p>
  <p>Four sections follow (Cell types, Replicated genes, Gene sets, Cohorts), each with an (i) after the heading for the longer explanation and (i) icons on the column headers. <strong>Cell types</strong> is one table with a row per cell type: cohorts, genes that meet the criteria, how many of them are strict, and the strongest examples (grey rows have no hit, usually because only two cohorts were tested, so the test has little power). <strong>Replicated genes</strong> lists the genes of the main cell type once, <strong>Gene sets</strong> the replicated gene sets, and <strong>Cohorts</strong> the cohorts with their donors and covariates.</p>
  <p>The expert details are closed by default. They hold the counts per tier and cell type (uncapped), the cohort table with the counted cohorts first and the others in grey, the genomic inflation lambda where the API serves it, and the full replication rule. The Detail (old) tab keeps the effects per dataset and cell type, the value distribution and the datasets that carry the facet. Effects are drawn as <a href="#glossary-effect-bar">effect bars</a> on a fixed scale per unit, so bars compare between rows and pages.</p>
