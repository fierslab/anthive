id: facet-overview
title: The facet overview
summary: The Overview tab of a facet page answers which genes and gene sets change with the facet and where the finding is repeated, in a sentence, one line per cell type and one table, with the expert details closed.
related:
- facet-counting
- facet-pathology-axis
- gene-view
terms:
