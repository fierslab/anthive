id: module-scores
title: Module scores
summary: A module score summarises a curated gene set per cell (default scanpy score_genes, or UCell); score variation across annotations is a per-cell association, not a donor-level test.
related:
- genes
- per-cell-per-donor
terms:
- per-cell-association
aliases:
- module score
- gene set score
- geneset
- ucell
- score_genes
body_html: |
  <p>A module score condenses a curated gene set into one number per cell: the mean expression of the set minus the mean of expression-matched control genes. The default method is scanpy <code>score_genes</code>; UCell is the alternative (choose it in Preferences). Scores are precomputed for many datasets and listed on the Genesets tab, which opens with one row per scored gene set: its rank among the other gene sets of the dataset (the percent of them with a lower mean score), the standard deviation of the score over the cells, and plot icons, in the same bars as the Genes tab. The per-cell associations with the annotation columns are on the next tab, Facet GS. The standard deviation here is the spread between cells; the donor-to-donor share of the variance (omega squared) is a different question and lives in the Donor variability tab.</p>
  <p>How a score varies across annotations (omega squared, spearman) is a <em>per-cell association</em>, which is descriptive and not a test (see <a href="#per-cell-per-donor">Per cell vs per donor</a>). Donor-level tests of module scores are part of the facet tests, where the score is averaged per donor first.</p>
  <p>Scores are computed per cell type. Each module declares the cell types it is meaningful for, and a module is scored only on the cells of the dataset whose cell type belongs to the same cell type group (see <a href="#facet-cell-type-groups">Cell type groups</a>). A microglia module has no score on the astrocytes of the same dataset, so those cells are empty rather than zero. The control genes of the score are drawn from the expression of the cells that were scored. Catalogs derived from whole-tissue data (a cell-type-agnostic catalog) are scored on every cell, and so are the marker panels that identify cell types, which are never part of the facet tests. Donor-level module tests only compare a module in cell types it was scored for.</p>

