body_html: |
  <p>A gene page (<a href="/genes">genes</a>, then a gene) opens with tabs: <strong>Expression</strong>, <strong>Facet DE</strong>, <strong>Donor variability</strong>, <strong>Other DE (author and custom)</strong> when a dataset stores differential expression for the gene (the authors' analysis or one added by the lab), and an <strong>Older views</strong> menu with the earlier expression table (<strong>Detection</strong>) and the earlier <strong>Atlas (old)</strong> page. Only the Expression tab has been reviewed so far. The other tabs are still fully usable but are greyed, carry a small <em>preview</em> marker and a note on top saying that the view is still being reviewed and results may change. Each tab has its own address (#expression, #facet-de (the old #shifts still works), #variability, #author-de, #detection, #atlas), so a link opens the tab you mean. Every section has an (i) after its heading that opens a longer explanation, and small (i) icons on column headers show a short tooltip on hover or tap.</p>
  <p>The <strong>Expression</strong> tab has two sections. <strong>Expression rank by cell type</strong> shows, for each cell type, where the gene sits relative to all other genes of the same dataset, as a percent: 76% means that 76% of the genes detected in the dataset have a lower average expression over all cells (cells without a count counted as zero) than this gene. It compares genes, not cells, and values below about 50% mostly mean the gene is barely expressed. The baseline depends on how many genes a dataset kept, so ranks are compared within one dataset, never as a shared scale. Datasets in a cell type row consist of one known cell type, so this is the rank within that cell type. A second bar, <em>Cells expressing (%)</em>, gives the percent of cells with at least one count of the gene (n/a for bulk samples), and <em>Std. dev.</em> gives the standard deviation of the log-normalised expression over all cells of the dataset (cells without a count included as zero, samples for bulk); it depends on each dataset's normalisation and depth, so it is shown per dataset only and left blank on cell type rows. The columns are the same on the Expression tab and on the dataset Genes tab: Cells, Cells expressing (%) in muted teal, Rank among genes (%) in muted slate blue, Std. dev. in muted sand, and Plots (histogram, ECDF and an embedding plot: UMAP, else t-SNE, else PCA; no embedding icon when the dataset has none). A cell type row is written as the cell type with the number of pooled datasets in grey brackets, for example microglia (n=25); its Cells column is the total number of cells in them, both bars show the median over them, and the Std. dev. is left blank because it depends on each dataset's normalisation. Rows are sorted by the median rank, strongest first. The open cell type is shown in bold. Open a row to see one line per dataset: the name is one link to the dataset page, and hovering or focusing it shows a card with the title, authors, category, nuclei or cells, organism, tissue and size. In vitro and bulk datasets sit after the pooled ones under "In vitro and bulk (not in the summary)": cultured cells and bulk samples are listed for comparison but not used for the cell type summary. <strong>Expression rank in other datasets</strong> lists, one by one, the datasets without a single known cell type (mixed, spatial, unclassified), where the percent describes the whole dataset. The gene set page has the same tab, built the same way, with gene sets ranked by their mean score. Ranks are only compared within one dataset.</p>
  <p>The earlier expression table (<strong>Detection</strong> tab) is descriptive and is one table with fixed columns: opening a cell type adds rows to the same table and nothing moves. Per cell type it shows the number of datasets with the total cells (for example n=34k), the percent of cells expressing the gene as a bar from 0 to 100 percent (mean over datasets, range in brackets), and the rank in dataset: the percentile of the gene's mean (log-normalised) expression among all genes of the same dataset, shown as "top x%". Open a row to see one bar pair per dataset with a dotted line at the mean over all datasets of that cell type, a tag for nuclei or cells (detection rates are not comparable between the two), and two links per dataset: the dataset page and that dataset's own plot of the gene by cell type. Rows are cell types across all datasets, not split by system; a dataset whose cells are all of one known cell type (for example sorted or cultured microglia) is listed in that cell type's row, whatever its system, and carries a tag for its category (post-mortem, xenograft for human cells in a mouse brain, biopsy, in vitro for cultured cells, or bulk). Only tissue datasets (post-mortem, xenograft, biopsy) are averaged into the numbers of the row; in vitro and bulk datasets are listed in the opened row, tagged and marked "not pooled", so cultured cells or bulk samples are never mistaken for tissue. A bulk dataset has no per-cell detection, so it shows n/a for the percent expressing, and its n counts samples. The facet tab keeps post-mortem and xenograft apart, because a facet effect is never pooled across systems. Under the separate header "Datasets without per-cell cell types" the remaining datasets are listed one by one, with their category tag, number of cells, percent expressing and rank in the dataset over all cells: those without a single known cell type (a whole-tissue object or a mix with no per-cell annotation), spatial datasets (a spot holds a mixture of cells) and unclassified ones. They cannot be averaged into a cell type row.</p>
  <p>The <a href="/genes">genes</a> landing page lists your favourite genes (set on the settings page, stored in your browser, shown when you are signed in) under "Your favourites" and a few fixed examples under "Examples".</p>
  <p>The <strong>Facet DE</strong> tab tests facets (sex, pathologic AD, Braak stage, age, APOE e4, App NL-G-F host) per donor, or per mouse in the xenograft block, one matrix per system. The columns are the same cell types in every matrix and on gene set pages, microglia first, so a cell type is always in the same column; a cell type that was not tested is a dash. Each cell shows only k/m, the cohorts significant on their own out of the cohorts tested. Grey means not replicated. A coloured cell is <strong>replicated</strong>: the same direction in at least 2 cohorts (<a href="#glossary-r-value">r-value</a> below 0.05), with an arrow for the direction. The darker colour also passes the strict test (<a href="#glossary-treat-tier">minimum-effect r-value</a>). A single cohort shows 0/1 or 1/1 and cannot replicate. One significant cohort is deliberately not a call, because in very large cohorts many genes are significant by chance. Grey is not evidence of no effect.</p>
  <p>Click a cell to list the datasets behind it, one row per dataset with its cohort, the number of donors, the <strong>LFC</strong> (log2 fold change of that dataset: test minus reference, or per Braak stage, per decade or per e4 allele for trend facets) and the <strong>adjusted p</strong> (the <a href="#glossary-fdr">false discovery rate</a> of that dataset on its own, not the replication result). A row marked "not counted" is shown but does not take part in k/m. Under a second header, <strong>Facet DE in other datasets</strong>, the datasets without a cell type column (mixed, unmapped or rare cell types) are listed with one row per dataset and facet, descriptive and not combined across cohorts; datasets that were not tested (spatial, proteomics, metacell sets, cultured cells, pure mouse, sets set aside by decision) are summarised in one line with the reason.</p>
  <p>Caveats sit in one short line of notes under each matrix, with the detail in the (i) box of the section. A note such as "Detected in only 3% of microglial cells: effects on rarely detected genes are fragile" appears for <a href="#glossary-low-detection">low detection</a> genes, which are found in fewer than 5 percent of the cells of the cell type (median over its datasets). Gene class notes (long gene, lncRNA, sex chromosome, APOE locus, mitochondrial) mark genes that are over-represented among hits for technical reasons. On a wide screen the cells form a matrix, on a phone the same results are a list. <strong>Donor variability</strong> is not built yet. The Author DE tab lists results as published; they come from cell-level models and are never combined with the facet results. Effects are drawn as <a href="#glossary-effect-bar">effect bars</a> on a fixed scale per unit, so bars compare between rows and pages.</p>
