body_html: |
  <p>A gene page (<a href="/genes">genes</a>, then a gene) opens with a one-line summary of what replicates, followed by tabs: <strong>1. Expression</strong>, <strong>2. What shifts it</strong>, <strong>3. Donor variability</strong>, <strong>Author DE (as published)</strong> when authors provided differential expression for the gene, and the earlier <strong>Atlas (old)</strong> page last. Each tab has its own address (#expression, #shifts, #variability, #author-de, #atlas), so a link opens the tab you mean. Every section has a round (?) button that opens a longer explanation, and small (i) icons on column headers show a short tooltip on hover or tap.</p>
  <p><strong>1. Expression</strong> is descriptive and is one table with fixed columns: opening a cell type adds rows to the same table and nothing moves. Per cell type it shows the number of datasets with the total cells (for example n=34k), the percent of cells expressing the gene as a bar from 0 to 100 percent (mean over datasets, range in brackets), and the rank in dataset: the percentile of the gene's mean (log-normalised) expression among all genes of the same dataset, shown as "top x%". Open a row to see one bar pair per dataset with a dotted line at the mean over all datasets of that cell type, a tag for nuclei or cells (detection rates are not comparable between the two), and two links per dataset: the dataset page and that dataset's own plot of the gene by cell type. Rows are cell types across all datasets, not split by system; a dataset whose cells are all of one known cell type (for example sorted or cultured microglia) is listed in that cell type's row, whatever its system, and carries a tag for its category (post-mortem, xenograft for human cells in a mouse brain, biopsy, in vitro for cultured cells, or bulk). Only tissue datasets (post-mortem, xenograft, biopsy) are averaged into the numbers of the row; in vitro and bulk datasets are listed in the opened row, tagged and marked "not pooled", so cultured cells or bulk samples are never mistaken for tissue. A bulk dataset has no per-cell detection, so it shows n/a for the percent expressing, and its n counts samples. The facet tab keeps post-mortem and xenograft apart, because a facet effect is never pooled across systems. Under the separate header "Datasets without per-cell cell types" the remaining datasets are listed one by one, with their category tag, number of cells, percent expressing and rank in the dataset over all cells: those without a single known cell type (a whole-tissue object or a mix with no per-cell annotation), spatial datasets (a spot holds a mixture of cells) and unclassified ones. They cannot be averaged into a cell type row.</p>
  <p>The <a href="/genes">genes</a> landing page lists your favourite genes (set on the settings page, stored in your browser, shown when you are signed in) under "Your favourites" and a few fixed examples under "Examples".</p>
  <p><strong>2. What shifts it</strong> tests facets (sex, pathologic AD, Braak stage, age, APOE e4, App NL-G-F host) per donor, or per mouse in the xenograft block, one matrix per system. Each cell shows only k/m, the cohorts significant on their own out of the cohorts tested. Grey means not replicated. A coloured cell is <strong>replicated</strong>: the same direction in at least 2 cohorts (<a href="#glossary-r-value">r-value</a> below 0.05), with an arrow for the direction. The darker colour also passes the strict test (<a href="#glossary-treat-tier">minimum-effect r-value</a>). A dash means not tested. A single cohort shows 0/1 or 1/1 and cannot replicate. One significant cohort is deliberately not a call, because in very large cohorts many genes are significant by chance. Grey is not evidence of no effect.</p>
  <p>Click a cell to open it. The sentence says what was found. The <strong>donor plot</strong> shows, per cohort, one dot per donor (per mouse in the xenograft block) with the value that was tested, so you can judge the spread behind an estimate; the box "adjusted for covariates" shows the same donors after removing what the model adjusts for, and the plot can be opened as an image or as JSON values. Below it a table lists one row per cohort with its size, the estimate, a 95 percent interval and <strong>q</strong>, the <a href="#glossary-fdr">false discovery rate</a> of that cohort on its own (a filled dot means q below 0.05). That q is not the replication result: the r-value combines the cohorts. "Per-cell view in" links open a descriptive plot of the cells of an anchor dataset, which shows cells, not donors, and is not the test. The <a href="#glossary-effect-filter">effect filter</a> and other details sit under "More detail".</p>
  <p>Caveats sit in one short line of notes under each matrix, with the detail in the (?) panel. A note such as "Detected in only 3% of microglial cells: effects on rarely detected genes are fragile" appears for <a href="#glossary-low-detection">low detection</a> genes, which are found in fewer than 5 percent of the cells of the cell type (median over its datasets). Gene class notes (long gene, lncRNA, sex chromosome, APOE locus, mitochondrial) mark genes that are over-represented among hits for technical reasons. On a wide screen the cells form a matrix, on a phone the same results are a list. <strong>3. Donor variability</strong> is not built yet. The Author DE tab lists results as published; they come from cell-level models and are never combined with the facet results. Effects are drawn as <a href="#glossary-effect-bar">effect bars</a> on a fixed scale per unit, so bars compare between rows and pages.</p>
