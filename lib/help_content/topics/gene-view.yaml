body_html: |
  <p>The <strong>Gene view</strong> tab of a gene page (<a href="/genes">genes</a>, then a gene) sits next to the older Atlas tab. It has three numbered sections, each with a round (?) button that opens a longer explanation, and small (i) icons on column headers that show a short tooltip on hover or tap.</p>
  <p><strong>1. Where is it expressed</strong> is descriptive. Per cell type it shows three things. The number of datasets with the total cells (for example n=34k). The percent of cells expressing the gene, as a bar from 0 to 100 percent (mean over datasets, range in brackets). And the rank in dataset: the percentile of the gene's mean (log-normalised) expression among all genes of the same dataset, shown as "top x%" with a longer bar for a more highly expressed gene. Open a row to see one bar pair per dataset with a dotted line at the mean over all datasets of that cell type, and a tag for nuclei or cells, because detection rates are not comparable between the two. A line under the table counts the datasets without per-cell cell types: their cell type comes only from a dataset-level label (a whole-tissue or multi-cell-type object), so their cells cannot be assigned to microglia, astrocytes and so on and they are not averaged into the cell type rows.</p>
  <p><strong>2. What shifts it</strong> tests facets (sex, pathologic AD, Braak stage, age, APOE e4, App NL-G-F host) per donor, or per mouse in the xenograft block, one matrix per system. Each cell shows only k/m, the cohorts significant on their own out of the cohorts tested. Grey means not replicated. A coloured cell is <strong>replicated</strong>: the same direction in at least 2 cohorts (<a href="#glossary-r-value">r-value</a> below 0.05), with an arrow for the direction. The darker colour also passes the strict test (<a href="#glossary-treat-tier">minimum-effect r-value</a>). A dash means not tested. A single cohort shows 0/1 or 1/1 and cannot replicate. One significant cohort is deliberately not a call, because in very large cohorts many genes are significant by chance. Grey is not evidence of no effect. Hover a cell for a plain sentence, click it for the cohorts with estimates, confidence intervals and donors, and for the <a href="#glossary-effect-filter">effect filter</a> and other details under "More detail". Panel 3, donor variability, is not built yet.</p>
  <p>Caveats sit in one short line of notes under each matrix, with the detail in the (?) panel. A note such as "Detected in only 3% of microglial cells: effects on rarely detected genes are fragile" appears for <a href="#glossary-low-detection">low detection</a> genes, which are found in fewer than 5 percent of the cells of the cell type (median over its datasets). Gene class notes (long gene, lncRNA, sex chromosome, APOE locus, mitochondrial) mark genes that are over-represented among hits for technical reasons. On a wide screen the cells form a matrix, on a phone the same results are a list. The Author DE tab, shown when authors provided differential expression for the gene, lists those results as published; they come from cell-level models and are never combined with the facet results.</p>
