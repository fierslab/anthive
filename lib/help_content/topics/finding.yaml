body_html: |
  <p>The search box on the <a href="/home">front page</a> (the <em>home</em> link of the top bar) searches everything the site holds: datasets, collections, genes, gene sets, papers, artefacts, facets and these help pages, limited to what you may see. Results are grouped by kind with a count per group and the first few of each; <em>show all</em> opens one group, and the results page has its own box to change the words. The front page is kept plain: the anthive logo, the search box and one line of links to browse by disease, cell type or dataset. Two example questions appear under the box when the page has been left alone for a minute. On every other page a magnifier button in the top bar (or the <code>/</code> key, when you are not typing in a field) opens a small search box next to it; it gives the same results as the front page, and Esc or a click elsewhere closes it. The search results and the browse pages are previews while they are reviewed. The anthive logo at the top left opens the site's start page. On most sites that is the front page; some sites open one study's collection page there instead, and the front page is then still one click away under <em>home</em>.</p>
  <ul>
    <li><strong>Search.</strong> Type words as you would ask a colleague, for example <code>TREM2 microglia Alzheimer</code>. The results are grouped into genes, datasets, gene sets and, when the site has a paper library, papers. Filler words such as <em>expression</em>, <em>in</em>, <em>across</em>, <em>which</em> and <em>datasets</em> are dropped. A word that is the exact name of a gene (case does not matter) is listed as a gene: open it to see its expression in every dataset, grouped by cell type. A gene name does not narrow the datasets, because nearly every dataset measures nearly every gene. A word that names a disease, cell type, organism or tissue recorded in the catalogue must match that field (<em>microglia</em> finds datasets recorded as microglia, not a neuron dataset whose description mentions microglia); every other word must occur in a dataset's title, collection, author names (of the dataset or its collection, so <code>Sierksma</code> finds that study's datasets), description, method or the names of its cell annotation columns. A word also matches inside a longer word (<em>microglia</em> finds <em>microglial cell</em>), a plural s is optional, and AD, PD, MS, ALS, FTD and APOE4 are expanded. Searching for <code>APOE4 carriers</code> finds datasets with an APOE e4 carrier column; how many of their donors carry the allele is on the dataset page. Only the datasets you may see are searched.</li>
    <li><strong>Papers.</strong> A paper is listed when its library record holds every word (citekey, title, any author, journal, DOI, keywords and topics, summary) or when one passage of its full text holds every word. Up to three such passages are shown under the paper with the section and page, and a small note says where the words were found (for example <em>title, full text</em>). Papers found in both places come first, then papers found in the record only, then papers found in the full text only, best passage first. The full text search looks at the 50 best passages of the whole library, so for a very common word not every paper that mentions it is listed; reference lists are not searched. It is keyword matching, not a reading of the paper: a passage that names a gene is not necessarily about it.</li>
    <li><strong>Other kinds.</strong> A collection is listed when its own text (title, authors including first and last author, summary, description, DOI) holds every word or when it holds a matching dataset. Artefacts match on their title, description, kind and the dataset or collection they belong to; withdrawn ones are marked. <span data-ui="facets">Facets match on their name and definition. </span>Help matches the text of each topic and glossary term and opens the page at that section.</li>
    <li><strong>Browse by disease.</strong> <a href="/diseases">One row per disease</a> with the number of datasets and collections that record it; click a disease for its datasets. A dataset with patients and controls is listed under both, and datasets that record no disease are left out (the page says how many). The counts are datasets, not donors.</li>
    <li><strong>Browse by cell type.</strong> <a href="/cell-types">One row per cell type</a> recorded for whole datasets (microglia for a sorted microglia study, several types for whole-tissue data), with the same counts and lists.</li>
    <li><strong>Browse by dataset.</strong> <a href="/collections">The collection list</a>: every collection (one per study), newest first, described below.</li>
  </ul>
  <p>In the collection list:</p>
  <ul>
    <li><strong>Search box.</strong> Type anything: a paper title, an author, a journal or year, a DOI or PubMed id, a tissue, cell type, disease or method, a collection or dataset code, or the name of a dataset inside a collection. Several words must all match (so <code>microglia prefrontal</code> narrows the list). Case and accents do not matter, and matching words are highlighted.</li>
    <li><strong>Shortcut and sharing.</strong> Press <code>/</code> anywhere on the page to jump to the search box. The search is kept in the address bar, so you can copy the URL to share exactly the list you see.</li>
    <li><strong>Filters.</strong> The <em>Filters</em> button opens chips for organism, cell type, tissue, method and disease, with counts. Chips in one group combine as OR, chips in different groups as AND. Filters are also kept in the URL and remembered in your browser.</li>
    <li><strong>Tags only where it matters.</strong> Each collection shows small tags only for what is unusual in this catalogue (for example <em>mouse</em>, <em>spatial</em>, <em>astrocytes</em>, <em>prefrontal cortex</em>). The common case (human, brain, microglia, single-cell RNA, Alzheimer's) is not repeated on every row. Collections whose access differs from the usual get a small mark (for example <em>public</em>).</li>
    <li><strong>Sorting.</strong> Recently added, paper year, number of cells, or name.</li>
    <li><strong>Table view.</strong> The <em>Table view</em> button switches to a classic table with all columns, following the same search and filters.</li>
  </ul>
