id: facet-replicates-needed
title: How many replicates are needed
summary: 'A level needs at least 3 replicates (numeric facets such as Braak and age: at least 4 with 3 distinct values); fewer than 5 per level are flagged as small sample.'
terms:
- descriptive-only
aliases:
- how many replicates
- minimum replicates
- small sample
body_html: |
  <p>Estimates are shown from 3 replicates per group. p and q values are given from 5 donors per group (10 donors for a Braak or age trend) in human cohorts, and from 3 animals per group (6 for a trend) in mouse and xenograft data, where animals of one strain and age vary far less than human donors. Below these numbers the row is <a href="#glossary-descriptive-only">descriptive only</a>. With 5 donors per group only large effects can be detected; a missing hit means "not detected with this many donors", not "no effect".</p>
