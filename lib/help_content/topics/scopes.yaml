id: scopes
title: Facet scopes
summary: A facet scope is the kind of system a dataset comes from (human post-mortem, xenograft of human cells in mouse, in vitro); facets are tested, counted and replicated within one scope and results are never merged across scopes.
related:
- facet-counting
- facet-app-nlgf
terms:
- scope
aliases:
