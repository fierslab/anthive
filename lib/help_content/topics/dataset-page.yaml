id: dataset-page
title: Dataset page
summary: Tabs in reading order (Overview, Data, Genes, Gene sets, Facets & DE, Papers, Artefacts, Downloads, Caveats), with the stored column tables and the facet mapping behind Technical details, closed by default.
aliases:
- dataset tabs
- technical details
body_html: |
  <p>At the top: the <strong>id strip</strong> with the collection, dataset and database ids (click to select and copy<span data-ui="api">; you need the database id, for example <code>L26/FMG</code>, in the API, vark, pyvark<span data-ui="mcp"> and MCP</span></span>), provenance (access, source, license, links to the DOI or accession), the title, a short description, context pills and the numbers of cells and genes. The <em>visualize</em> menu (top right) opens the plot builder.</p>
  <p>The tabs are in reading order and use plain names, for example <em>Sex</em>, <em>Disease</em> or <em>APOE e4 carrier</em> for the standard cell annotation columns. Under the tab bar, <strong>Technical details</strong> (closed by default) opens a second row with the tables of every cell annotation column under its stored name (such as <code>ant_apoe4_carrier</code>) and the facet mapping; while it is open, the stored names also appear next to the plain names on the Data tab. Old links to these tabs (<code>#num</code>, <code>#cat</code>, <code>#facets</code>) still work and open Technical details.</p>
  <div class="table-wrap">
  <table>
    <tr><th>Tab</th><th>What it shows</th></tr>
    <tr><td>Overview</td><td>The written description of the dataset, when there is one.</td></tr>
    <tr><td>Data</td><td>The numbers of cells and genes, the biology (organism, technology, cell type, tissue, disease), the standard cell annotations under plain names with plot links, the expression layers and the embeddings (UMAP, PCA).</td></tr>
    <tr><td>Genes</td><td>Expression statistics per gene (cells expressing it, its rank among the genes of the dataset, spread over the cells); search, sort and star favourites.</td></tr>
    <tr><td>Gene sets</td><td>Module scores already computed for curated gene sets: one row per gene set with its rank among the other gene sets of the dataset, the spread of the score over the cells and plot icons.</td></tr>
    <tr><td>Facets &amp; DE</td><td><span data-ui="facets">One tab with up to three sub-tabs. <em>Genes</em> shows the donor-level facet effects as a table with one row per facet and one column per cell type: each cell gives the number of genes that differ at q &lt; 0.05, split into higher and lower, or why there is no test. Click a cell for its genes (fold change, q, donors, a volcano plot and a CSV file). Each gene has plot links for that facet and cell type: first the per donor plot page (one value per donor, the values the test used, with the number of donors, the estimate and downloads), then per cell plots of the cells of that cell type (violin, ECDF, histogram and the embedding; descriptive). The &#9432; after a facet holds its model and flags, and <em>full effects table</em> opens the earlier tables. The number of significant genes grows with the number of donors, so compare cells within one dataset, not colours across datasets. <em>Gene sets</em> shows the same matrix for gene sets tested per donor, with a switch between the three score variants (pseudobulk, cell mean of the scanpy score, cell mean of the UCell score); a gene set counts as significant by the rule used for replication (the model q with at least 30 residual degrees of freedom, else the permutation q). The earlier per-cell associations (descriptive) open from the link in its heading. Under the facet matrices, <em>Other DE (author and custom)</em> shows the differential expression stored with the dataset, one matrix per study; these are not donor-level facet tests, are not counted towards replication and should not be compared with the facet results. The Genes and Gene sets sub-tabs are marked <em>preview</em> while they are reviewed. </span><em>DE studies</em> lists the precomputed differential expression studies of the dataset, when it has them: studies, terms, contrasts and genes, with volcano and MA plots.</td></tr>
    <tr><td>Papers</td><td>The papers linked to this dataset, with the reason (for example <em>Source of this dataset</em>), a short summary, PDF, DOI, PubMed and BibTeX.</td></tr>
    <tr><td>Artefacts</td><td>Analysis files deposited with this dataset (DE tables, figures, tables, notebooks, reports, models), each with its versions. Greyed when there are none.</td></tr>
    <tr><td>Downloads</td><td>The original <code>.h5ad</code> file, the papers' PDFs and any other files that belong to the study. Greyed when there is nothing to download.</td></tr>
    <tr data-ui="caveats"><td>⚠ Caveats</td><td>Known problems with this dataset (contamination, batch effects, missing metadata). Read them before drawing conclusions. A ⚠ in the lists marks datasets that have caveats. Greyed when no caveats are recorded.</td></tr>
  </table>
  </div>
  <p>Behind <strong>Technical details</strong>:</p>
  <div class="table-wrap">
  <table>
    <tr><th>Tab</th><th>What it shows</th></tr>
    <tr><td>Numerical columns</td><td>Every numeric cell annotation under its stored name (age, Braak stage, QC metrics, scores) with summaries and quick plots.</td></tr>
    <tr><td>Categorical columns</td><td>Every categorical annotation under its stored name (cell type, donor, disease, sex) with value counts and quick plots. A column with more than 50 values has no plots; it lists its 15 most common values with their cells and share instead, or only the count when the values are donor identifiers.</td></tr>
    <tr data-ui="facets"><td>Facet mapping</td><td>A small table of tags (scope, replicate unit, disease basis, primary data or reanalysis, and whether the dataset counts towards replication across datasets, each with an &#9432; that explains it), then the harmonised annotation columns (facets) of this dataset and how its own columns map onto them, value by value.</td></tr>
  </table>
  </div>
  <p>Tabs only appear when the dataset has that kind of data; Downloads and Artefacts are always shown and greyed when empty<span data-ui="caveats">, and so is Caveats</span>.</p>
  <p>Explanations are hidden until you need them: press the &#9432; after a heading or a label to show the explanation, and press it again to close it. Short notes on column headers still appear when you hover over or tap the &#9432;.</p>
