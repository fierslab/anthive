id: dataset-page
title: Dataset page
summary: The dataset page has the id strip with the database id you need in the API, provenance, and tabs (Overview, Data, Numerical, Categorical, Genes, Genesets, Facet (with the sub-tabs Gene and GS), Differential expression, Papers, Downloads, Caveats). Most appear only when the dataset has that data; Downloads and Caveats are always there and greyed when empty.
aliases:
- dataset tabs
body_html: |
  <p>At the top: the <strong>id strip</strong> with the collection, dataset and database ids (click to select and copy; you need the database id, for example <code>L26/FMG</code>, in the API, vark, pyvark and MCP), provenance (access, source, license, links to the DOI or accession), the title, a short description, context pills and the numbers of cells and genes. The <em>visualize</em> menu (top right) opens the plot builder.</p>
  <div class="table-wrap">
  <table>
    <tr><th>Tab</th><th>What it shows</th></tr>
    <tr><td>Overview</td><td>The written description of the dataset, when there is one.</td></tr>
    <tr><td>Data</td><td>Layers, embeddings (UMAP, PCA) and an overview of the cell annotation columns.</td></tr>
    <tr><td>Numerical</td><td>Numeric cell annotations (age, Braak stage, QC metrics, scores) with summaries and quick plots.</td></tr>
    <tr><td>Categorical</td><td>Categorical annotations (cell type, donor, disease, sex) with value counts and quick plots.</td></tr>
    <tr><td>Genes</td><td>Expression statistics per gene (mean, standard deviation, coefficient of variation, fraction of cells expressing it); search, sort and star favourites.</td></tr>
    <tr><td>Genesets</td><td>Module scores already computed for curated gene sets: one row per gene set with its rank among the other gene sets of the dataset, the spread of the score over the cells and plot icons.</td></tr>
    <tr><td>Facet</td><td>One tab with two sub-tabs. The tab itself starts with a small table of tags (scope, replicate unit, disease basis, primary data or reanalysis, and whether the dataset counts towards replication across datasets, each with an &#9432; that explains it), then lists the harmonised annotation columns (facets) of this dataset and how its own columns map onto them. <em>Gene</em> shows the donor-level facet effects per cell type when they were tested, or why they were not. <em>GS</em> shows the gene set scores compared with the cell annotation columns (how strongly each score varies across them) as a filterable list; these are per-cell associations, descriptive only, and the sub-tab is marked <em>preview</em> while it is reviewed.</td></tr>
    <tr><td>Differential expression</td><td>Precomputed differential expression results, when the dataset has them: studies, terms, contrasts and genes, with volcano and MA plots.</td></tr>
    <tr><td>Papers</td><td>The papers linked to this dataset, with the reason (for example <em>Source of this dataset</em>), a short summary, PDF, DOI, PubMed and BibTeX.</td></tr>
    <tr><td>Downloads</td><td>The original <code>.h5ad</code> file, the papers' PDFs and any other files that belong to the study. Greyed when there is nothing to download.</td></tr>
    <tr><td>⚠ Caveats</td><td>Known problems with this dataset (contamination, batch effects, missing metadata). Read them before drawing conclusions. A ⚠ in the lists marks datasets that have caveats. Greyed when no caveats are recorded.</td></tr>
  </table>
  </div>
  <p>Tabs only appear when the dataset has that kind of data, except Downloads and Caveats, which are always shown and greyed when empty.</p>
  <p>Explanations are hidden until you need them: press the &#9432; after a heading or a label to show the explanation, and press it again to close it. Short notes on column headers still appear when you hover over or tap the &#9432;.</p>
