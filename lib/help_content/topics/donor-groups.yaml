id: donor-groups
title: Donor groups and shared donors
summary: A donor group names datasets that share donors (splits of one study, or several studies of one cohort); they are never counted as independent replications.
related:
- facet-replication
- facet-counting
terms:
- cohort
- donor-overlap
aliases:
- donor group
- donor overlap
- shared donors
- cohort
body_html: |
  <p>Datasets often share people: complementary splits of one study (cell classes, regions, libraries) or several studies of one cohort (for example ROSMAP in several datasets). A <em>donor group</em> names such datasets. Cross-dataset counts treat a donor group as one source of evidence, secondary datasets (reanalyses) are listed but not counted, and the distinct donors of a cohort are counted by a donor identifier that is shared across datasets.</p>
  <p>Listings show every dataset: the datasets page, collection pages, search and the AI tools list reanalyses by default, marked as a reanalysis (the AI dataset search adds "reanalysis of" and the id of the source dataset). Only counting leaves them out: the facet tests, replication counts, donor variability and the other cross-dataset numbers skip reanalyses by default, because a reanalysis reuses the same cells and would count them twice.</p>
  <p>A <em>QC companion</em> holds all cells of a dataset before filtering, with their per-cell quality statistics and the keep flag; the dataset itself holds the cells that were kept. The QC companion is marked "QC companion of" its dataset on its page and in the lists, the dataset links to its QC companion, and it is never counted in statistics or facet tests.</p>
  <p>Datasets whose donor overlap has not been checked are flagged <em>donor overlap not checked</em>. The API lists the groups under <code>/api/donor-groups</code>.</p>
