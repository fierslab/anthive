id: geneset-view
title: The gene set view
summary: A gene set page has tabs for expression rank, the earlier module score table, facet DE (ranked shifts and a matrix) and the member genes, plus the earlier page.
related:
- gene-view
- module-scores
- facet-counting
terms:
- effect-bar
- rank-among-gene-sets
- r-value
- pseudobulk
- effect-filter
aliases:
- geneset view
- gene set page
- module result
body_html: |
  <p>A gene set page mirrors the gene view: tabs <strong>Expression</strong>, the earlier <strong>Module score</strong> table, <span data-ui="facets"><strong>Facet DE</strong>, </span><strong>Genes</strong>, and the earlier <strong>Gene set page (old)</strong> in the <strong>Older views</strong> menu (addresses #expression, #module-score, <span data-ui="facets">#facet-de (the old #shifts still works), </span>#genes, #page). Only the Expression tab has been reviewed so far; the others are greyed with a <em>preview</em> marker and a note that results may change. The Expression tab is the same table component as on the gene page, with the same cell type rows (cell type and the number of pooled datasets in grey brackets, opened in bold), hover card on the dataset name, in vitro and bulk sub-label and Plots column. Its columns are Cells, Rank among gene sets (%) in muted slate blue (the percent of the other gene sets scored on the same cells of the same dataset that have a lower mean scanpy score than the set, so 76% means a higher score than 76% of them; the median over the datasets of a cell type), Std. dev. in muted sand (the standard deviation of the module score over all cells in the dataset, samples for bulk; scores of different scoring methods are on different scales, so compare within one dataset) and Plots (histogram, ECDF and embedding plot of the score). Cells expressing is not shown: a module score has no zero to count against; datasets without a single cell type are listed under "Expression rank in other datasets". Only datasets in which the set was scored are listed, and only gene sets that apply to the cell type of the dataset are compared (a set built for microglia is compared with the microglia sets and the sets that apply to every cell, not with astrocyte sets). The header names where the set comes from: experiment, method, source dataset and its source paper. The Donor variability tab stays hidden until its panel exists. Panel 1 lists the datasets in which the set has a per-cell score and summarises them per cell type in one fixed-width table. Its main column is the <a href="#glossary-rank-among-gene-sets">rank among gene sets</a>: where the mean score of the set falls among ALL gene sets scored on the same cells of the same dataset, shown as "top x%" with a bar (in a cell type row the mean over its datasets, in an opened dataset row the dotted line marks that mean). A mean score by itself is not comparable between datasets, so it is not shown; the rank is, because it is taken inside one dataset. It uses the scanpy score (the mean of the set minus a matched control set), which is comparable between sets of one dataset. UCell is not used for it, because UCell depends on the number of genes in the set. The rank compares gene sets within one dataset only, never across datasets. A set scored on the cells of its own cell type ranks low in other cell types by construction, so read the rank in the cell type the set belongs to. Each opened dataset row links to the dataset page and to that dataset's plot of the score by cell type.<span data-ui="facets"> Panel 2 opens with <strong>Ranked shifts</strong>: one line per facet and cell type with a module result, best first by the partial-conjunction p value before adjustment (the r-value ties at 1), within one system, never mixing post-mortem and xenograft. Each line shows the <a href="#glossary-effect-bar">effect bar</a> (median over the counted cohorts, whisker from the smallest to the largest cohort), the direction in words, how many cohorts point the same way and how many are significant on their own, the r-value after adjusting over all gene sets of the family, and the rank of this set among them ("ranks 2nd of 122 gene sets"). The first five are shown. When only one counted cohort is informative (smaller group of at least 10 donors, or at least 30 donors for a trend), the line says replication is not possible. The matrix cells show the module result only; the member genes that replicate on their own are counted in one line per facet under the matrix, and genes on the X or Y chromosome are left out for the sex facet. It tests the mean score of the whole set per donor against each facet and combines cohorts with the same partial conjunction test as for genes (<a href="#glossary-r-value">r-value</a> below 0.05, Benjamini-Hochberg over the modules of one family). The effect filter for a set is a standardised effect whose lower 95 percent confidence bound reaches the facet gate (0.2 standard deviations per contrast, 0.2/3 per Braak stage, 0.2 per decade, 0.1 per e4 allele) in 2 cohorts, and there is no strict tier.</span></p>
  <p data-ui="facets">Where counts exist the result of the donor-level <a href="#glossary-pseudobulk">pseudobulk</a> of the member genes is shown, else the mean of the per-cell scores per donor, and the opened cell says which. A warning marks cohorts where the two disagree in a way that matters. The matrix has the same fixed columns as on the gene page (microglia first, a dash where a cell type was not tested). A click on a cell lists the datasets behind it, one row per dataset with its cohort, donors, the effect (in standard deviations of the donor-level score) and the q of that dataset on its own; the member genes that replicate on their own are listed under the matrix. Under a second header, Facet DE in other datasets, datasets without a cell type column and the datasets that were not tested (with the reason) are listed. A flat module result can hide member genes that replicate, and the other way round.</p>
  <p data-ui="facets">A set of loci from genome-wide association studies has no expected direction, so a mean score is not well suited to it and the member-gene counts are the more useful result. Sets that are mostly mitochondrial or ribosomal genes are marked quality-sensitive, because their score tracks RNA quality. The Genes tab lists every member gene with a link to its gene page and the facet calls it has on its own.</p>
