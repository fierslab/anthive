- module result
body_html: |
  <p>A gene set page mirrors the gene view: a one-line summary on top, then the tabs <strong>1. Module score</strong>, <strong>2. What shifts it</strong>, <strong>Genes</strong> and the earlier <strong>Geneset page (old)</strong> last (addresses #module-score, #shifts, #genes, #page). The header names where the set comes from: experiment, method, source dataset and its source paper. The Donor variability tab stays hidden until its panel exists. Panel 1 lists the datasets in which the set has a per-cell score and summarises them per cell type in one fixed-width table. Its main column is the <a href="#glossary-rank-among-gene-sets">rank among gene sets</a>: where the mean score of the set falls among ALL gene sets scored on the same cells of the same dataset, shown as "top x%" with a bar (in a cell type row the mean over its datasets, in an opened dataset row the dotted line marks that mean). A mean score by itself is not comparable between datasets, so it is not shown; the rank is, because it is taken inside one dataset. It uses the scanpy score (the mean of the set minus a matched control set), which is comparable between sets of one dataset. UCell is not used for it, because UCell depends on the number of genes in the set. The rank compares gene sets within one dataset only, never across datasets. A set scored on the cells of its own cell type ranks low in other cell types by construction, so read the rank in the cell type the set belongs to. Each opened dataset row links to the dataset page and to that dataset's plot of the score by cell type. Panel 2 opens with <strong>Ranked shifts</strong>: one line per facet and cell type with a module result, best first by the partial-conjunction p value before adjustment (the r-value ties at 1), within one system, never mixing post-mortem and xenograft. Each line shows the <a href="#glossary-effect-bar">effect bar</a> (median over the counted cohorts, whisker from the smallest to the largest cohort), the direction in words, how many cohorts point the same way and how many are significant on their own, the r-value after adjusting over all gene sets of the family, and the rank of this set among them ("ranks 2nd of 122 gene sets"). The first five are shown. When only one counted cohort is informative (smaller group of at least 10 donors, or at least 30 donors for a trend), the line says replication is not possible. The matrix cells show the module result only; the member genes that replicate on their own are counted in one line per facet under the matrix, and genes on the X or Y chromosome are left out for the sex facet. It tests the mean score of the whole set per donor against each facet and combines cohorts with the same partial conjunction test as for genes (<a href="#glossary-r-value">r-value</a> below 0.05, Benjamini-Hochberg over the modules of one family). The effect filter for a set is a standardised effect whose lower 95 percent confidence bound reaches the facet gate (0.2 standard deviations per contrast, 0.2/3 per Braak stage, 0.2 per decade, 0.1 per e4 allele) in 2 cohorts, and there is no strict tier.</p>
  <p>Where counts exist the result of the donor-level <a href="#glossary-pseudobulk">pseudobulk</a> of the member genes is shown, else the mean of the per-cell scores per donor, and the opened cell says which. A warning marks cohorts where the two disagree in a way that matters. An opened cell shows the donor plot (one dot per donor and cohort, with a box for "adjusted for covariates"), the cohort table with the estimate, interval and the q of each cohort on its own, and how many member genes replicate on their own for the same facet and cell type, with their names. A flat module result can hide member genes that replicate, and the other way round.</p>
  <p>A set of loci from genome-wide association studies has no expected direction, so a mean score is not well suited to it and the member-gene counts are the more useful result. Sets that are mostly mitochondrial or ribosomal genes are marked quality-sensitive, because their score tracks RNA quality. The Genes tab lists every member gene with a link to its gene page and the facet calls it has on its own.</p>
