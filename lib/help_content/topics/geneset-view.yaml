body_html: |
  <p>A gene set page mirrors the gene view: a one-line summary on top, then the tabs <strong>1. Module score</strong>, <strong>2. What shifts it</strong>, <strong>3. Donor variability</strong> and the earlier <strong>Geneset page (old)</strong> last (addresses #module-score, #shifts, #variability, #page). Panel 1 lists the datasets in which the set has a per-cell score and summarises the score per cell type in one fixed-width table; scores of different sets are not on one scale, so the sets are not ranked against each other. Each opened dataset row links to the dataset page and to that dataset's plot of the score by cell type. Panel 2 tests the mean score of the whole set per donor against each facet and combines cohorts with the same partial conjunction test as for genes (<a href="#glossary-r-value">r-value</a> below 0.05, Benjamini-Hochberg over the modules of one family). The effect filter for a set is a standardised effect of at least 0.2 standard deviations in 2 cohorts, and there is no strict tier.</p>
  <p>Where counts exist the result of the donor-level <a href="#glossary-pseudobulk">pseudobulk</a> of the member genes is shown, else the mean of the per-cell scores per donor, and the opened cell says which. A warning marks cohorts where the two disagree in a way that matters. An opened cell shows the donor plot (one dot per donor and cohort, with a box for "adjusted for covariates"), the cohort table with the estimate, interval and the q of each cohort on its own, and how many member genes replicate on their own for the same facet and cell type, with their names. A flat module result can hide member genes that replicate, and the other way round.</p>
  <p>A set of loci from genome-wide association studies has no expected direction, so a mean score is not well suited to it and the member-gene counts are the more useful result. Sets that are mostly mitochondrial or ribosomal genes are marked quality-sensitive, because their score tracks RNA quality. Panel 3 is not built yet.</p>
