id: facet-age
title: Age
summary: The age facet is a linear trend per decade; age and AD pathology are correlated, so the unadjusted result overlaps the pathology result and an adjusted twin adds Braak stage.
aliases:
- age facet
- age adjusted
body_html: |
  <p>The age facet is a straight-line trend per decade of age at death. Age and AD pathology are correlated in every brain bank, so the unadjusted age result overlaps with the pathology result. The adjusted twin of the facet adds Braak stage to the model, and the gene row shows whether the association persists. Donors under the declared age floor (60 years) are left out. In ROSMAP ages above 90 are recorded as 90.</p>
