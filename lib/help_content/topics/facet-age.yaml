id: facet-age
ui: facets
title: 'Age: two twins'
summary: The age facet is a linear trend per decade; age and AD pathology are correlated, so the unadjusted result overlaps the pathology result and an adjusted twin adds Braak stage.
terms:
- age-twins
aliases:
- age facet
- age adjusted
body_html: |
  <p>The age facet applies to human donors only and is always measured in years: age at death for post-mortem cohorts, age at surgery for biopsies. Mouse and other animal ages, the host age of a xenograft and binned author ages ('60-70') are not mapped to it.</p>
  <p>The age facet is a straight-line trend per decade of age at death, in donors of 60 years and older (younger donors are left out; a dataset can declare another floor). Age and AD pathology are correlated in every brain bank, so the age result is tested twice. <strong>Age, not adjusted for pathology</strong> re-detects part of the pathology signal. <strong>Age, adjusted for pathology</strong> adds Braak stage (else pathologic AD) to the model; what remains is age beyond pathology. A gene row of the unadjusted test says whether the association <em>persists after pathology adjustment</em>. In ROSMAP ages above 90 are recorded as 90, which flattens the oldest donors (<a href="#glossary-age-twins">glossary</a>).</p>
