id: differential-expression
title: Differential expression results
summary: Some datasets carry the authors' precomputed differential expression results (studies, terms, contrasts, genes); these are not anthive's own facet tests and are reported as the authors computed them.
related:
- facet-effects
- per-cell-per-donor
aliases:
- de
- differential expression
- volcano
- de results
body_html: |
  <p>Some datasets carry precomputed differential expression (DE) results, usually the ones reported by the authors of the study. They are organised as <em>studies</em>, each with <em>terms</em> and <em>contrasts</em>, and a row per gene with its fold change and significance. The Differential expression tab shows them with volcano and MA plots<span data-ui="api">; the API lists them under <code>/api/databases/{id}/de</code></span>.</p>
  <p>These are the authors' tests as they were run, with the authors' models<span data-ui="facets">, and are not comparable to the facet tests that anthive runs itself on pseudobulks per donor (see <a href="#facet-effects">Facets and facet effects</a>)</span>. Check how the study defined its replicates before quoting a DE result; DE computed over cells is subject to the problem described in <a href="#per-cell-per-donor">Per cell vs per donor</a>.</p>
