body_html: |
  <p>Each dataset declares what an independent <a href="#glossary-replicate-unit">replicate</a> is: a donor for human cohorts, the host animal for xenografts and mouse data (the human donor line of a xenograft is never the replicate), a sample for some bulk and in vitro data, or none. The Facets tab shows it as <em>Replicate unit</em> (for example "donor (ant_donor)"), and the Data tab repeats it.</p>
  <p>A unit is tested at <strong>replicate level</strong> when the dataset has a replicate unit and at least 3 replicates in every group of a two-group facet (at least 4 replicates over at least three distinct values for a trend such as Braak or age). Otherwise it is <strong>cell-level, descriptive only</strong>: no test, p or q is given, because cells are not replicates and treating them as such would make a difference between two donors look highly significant. The reason is stated on the unit (<a href="#glossary-analysis-level">analysis level</a>).</p>
