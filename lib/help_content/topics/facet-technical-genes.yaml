id: facet-technical-genes
title: Technical genes
summary: Some genes (mitochondrial, ribosomal, sex chromosome, long genes, lncRNA or clone names) are flagged because their effects are often technical.
aliases:
- technical genes
- gene classes
- gene flags
body_html: |
  <p>Mitochondrial transcripts, ribosomal proteins, long intron-rich genes and lncRNAs track nuclear RNA quality, post-mortem interval and ambient RNA in nuclei data, and are flagged on the gene row. A microglial gene changing in an astrocyte unit (for example INPP5D) is most likely ambient RNA or doublets, and the unit shows a foreign-marker flag when such genes move with the facet. Cytoplasmic transcripts such as cytokines are under-represented in nuclei, so a null for them is not informative.</p>
