<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Anthive3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.0.1/build/stlite.css" />
</head>

<body>
    <div id="root"></div>
    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.0.1/build/stlite.js";
        window.controller = mount(
            {
                entrypoint: "streamlit_app.py",
                requirements: [
                    "requests",
                    "matplotlib",
                    "pandas",
                    "numpy",
                    "scipy",
                    "seaborn"
                ],
                files: {
                    "antclient.py": await fetch('/stlite/antclient.py').then(r => r.text()),
                    "components.py": await fetch('/stlite/components.py').then(r => r.text()),
                    "util.py": await fetch('/stlite/util.py').then(r => r.text()),
                    "streamlit_app.py": await fetch('/stlite/streamlit_app.py').then(r => r.text()),
                    "pages/1_gene.py": await fetch('/stlite/pages/1_gene.py').then(r => r.text()),
                    "pages/2_umap.py": await fetch('/stlite/pages/2_umap.py').then(r => r.text()),
                    "pages/3_rolling.py": await fetch('/stlite/pages/3_rolling.py').then(r => r.text()),
                }
            },
            document.getElementById("root"),
        );
    </script>
</body>

</html>
