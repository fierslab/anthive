<!DOCTYPE html>
<html>
  <head>
    <title>JupyterLite</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="Description" content="WASM powered Jupyter running in the browser." />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      id="jupyter-lite-main"
      rel="preload"
      href="../build/lab/bundle.js?_=bd0bfcf"
      main="index"
      as="script"
    />
    <script
      id="jupyter-config-data"
      type="application/json"
      data-jupyter-lite-root=".."
    >
      {}
    </script>
    <script>
      (async function () {
        const { pathname, origin, search, hash } = window.location;
        if (pathname.match(/(index.html|\/?)$/) == null) {
          window.location.href = `${origin}${pathname}/${search}${hash}`;
          return;
        }

        // Pre-register service worker so it controls the page before the app starts.
        // Without this, there is a race condition where JupyterLite makes /api/drive
        // requests before the SW activates, causing a blank page on first load.
        if ('serviceWorker' in navigator) {
          try {
            const swUrl = `${origin}/jupyter/service-worker.js?enableCache=false`;

            // Pre-set the version in localStorage to prevent ServiceWorkerManager from
            // unregistering+re-registering the SW on every visit (its version-check loop
            // only sets the key when `controller` exists, which is not the case on first
            // visit, so it would unregister on the second visit creating another race).
            const versionKey = `${swUrl}-version`;
            if (!localStorage.getItem(versionKey)) {
              try {
                const resp = await fetch('../jupyter-lite.json');
                const config = await resp.json();
                const appVersion = config?.['jupyter-config-data']?.['appVersion'];
                if (appVersion) localStorage.setItem(versionKey, appVersion);
              } catch (_) {}
            }

            // Register and wait for SW to activate + claim, with a 5s safety timeout.
            // The timeout prevents a hang if the SW fails (e.g. goes to 'redundant').
            const timeout = new Promise(resolve => setTimeout(resolve, 5000));
            const swReady = (async () => {
              const registration = await navigator.serviceWorker.register(swUrl);
              const sw = registration.installing || registration.waiting || registration.active;
              if (sw && sw.state !== 'activated') {
                await new Promise((resolve, reject) => {
                  sw.addEventListener('statechange', function handler() {
                    if (this.state === 'activated') { sw.removeEventListener('statechange', handler); resolve(); }
                    else if (this.state === 'redundant') { sw.removeEventListener('statechange', handler); reject(new Error('SW redundant')); }
                  });
                });
              }
              if (!navigator.serviceWorker.controller) {
                await new Promise(resolve =>
                  navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true })
                );
              }
            })();

            await Promise.race([swReady, timeout]).catch(err =>
              console.warn('SW pre-registration did not complete, proceeding anyway:', err)
            );
          } catch (err) {
            console.warn('Service worker pre-registration failed, proceeding anyway:', err);
          }
        }

        await import(
          '../config-utils.js?_=bd0bfcf'
        );
      }.call(this));
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        transition: background-color 0.3s ease;
      }

      body {
        background-color: #fff;
        color: #000;
      }

      body.jp-mod-dark {
        background-color: #111;
        color: #fff;
      }

      #jupyterlite-loading-indicator {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1000;
        opacity: 0; /* Hidden by default */
        transition: opacity 0.5s ease-out;
        display: none; /* Hidden by default */
      }

      #jupyterlite-loading-indicator.hidden {
        animation: fadeOut 0.5s ease-out forwards;
        pointer-events: none;
      }

      /* Show the indicator when needed */
      #jupyterlite-loading-indicator:not(.hidden) {
        opacity: 1;
        display: block;
      }

      .jupyterlite-loading-indicator-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border: 6px solid rgba(0, 0, 0, 0.1);
        border-top: 6px solid #FFDC00; /* Bright yellow color */
        border-radius: 50%;
        animation: jupyter-spin 1s linear infinite;
      }

      body.jp-mod-dark .jupyterlite-loading-indicator-spinner {
        border: 6px solid rgba(255, 255, 255, 0.1);
        border-top: 6px solid #FFDC00;
      }

      .jupyterlite-loading-indicator-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 16px;
      }

      /* Adjust text color based on theme */
      body.jp-mod-light .jupyterlite-loading-indicator-text {
        color: #000000;
      }

      body.jp-mod-dark .jupyterlite-loading-indicator-text {
        color: #ffffff;
      }

      @keyframes jupyter-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes fadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body class="jp-ThemedContainer" data-notebook="lab">
    <div id="jupyterlite-loading-indicator" class="hidden">
      <div class="jupyterlite-loading-indicator-spinner"></div>
      <div class="jupyterlite-loading-indicator-text">Loading JupyterLite...</div>
    </div>
    <noscript>
      <div style="text-align: center; padding: 20px;">
          JupyterLite requires JavaScript to be enabled in your browser.
      </div>
    </noscript>
  </body>
</html>
