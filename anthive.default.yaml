# Anthive Default Configuration
# This file contains all allowed configuration parameters with their default values
# Copy to anthive.yaml in the same directory to customize

# Data Processing
# ---------------

# Maximum number of unique values for an obs column to be treated as categorical
# Columns exceeding this threshold are automatically excluded
max_obscat_values: 100

# Number of cells to process per chunk when melting expression layers
# Balance between memory usage and processing speed
# Smaller = less memory, slower; Larger = more memory, faster
melt_chunk_size: 10000

# REST API Configuration
# ----------------------

# Host address for the REST API server (ant-serve).  Default `localhost` (=
# 127.0.0.1) is secure: only the local machine can connect, and the Caddy
# reverse-proxy on this host fronts public access.  Set to `0.0.0.0` to
# bind on all interfaces (e.g. for direct LAN access without Caddy).
# Applies whether ant-serve runs standalone or via ant-supervisor.
rest_api_host: localhost

# Port number for the REST API server
rest_api_port: 8080

# Browse UI (ant-browse) bind host + port.  Same semantics as
# rest_api_host/port above.  Public access goes through Caddy on the
# default deployment, so `localhost` is appropriate.
browse_host: localhost
browse_port: 8081

# Cache expiration in days (future use)
cache_expiration_days: 7

# Locations and runtime switches
# ------------------------------
# Every path below may be absolute, relative to the repo root, or contain
# $VARS / ~ (expanded at use). Each one can also be overridden per process
# with the environment variable shown, which is how containers and HPC jobs
# set them without editing this file. lib/config.py resolves them.

# Data store root (the h5adstore). Env: ANTHIVE_H5ADSTORE.
h5adstore: data/h5adstore

# Donor-level facet test results (ant-facet-test, ant-facet-test-modules),
# read by ant-serve for /databases/{id}/facet-tests and /facets/{name}/...
# Empty means <h5adstore>/_facet_tests. Env: ANTHIVE_FACET_RESULTS_DIR.
facet_results_dir: ''

# Paper library: a separate repository of BibLaTeX-compatible .md sidecars
# (plus PDFs, synced via S3). See doc/LIBRARY.md. Env: ANTHIVE_LIBRARY.
library: data/library

# Authors whose papers go to papers/lab/ by default when added with
# ant lib-add / ant lib-import (folders are for people only).
library_lab_authors:
  - De Strooper

# Adding papers through the API (POST /papers/upload, MCP upload_paper) and
# the two-way library sync (`ant sync library`). See doc/LIBRARY.md.
# Who may upload: Remote-Groups of the caller (basic auth mode: auth.admins
# count as "admins").
library_upload_groups:
  - admins
# Largest PDF accepted by the upload endpoint, in MB.
library_upload_max_pdf_mb: 25
# Committer of upload commits in the library repo (the uploader is the author).
library_git_committer: anthive <noreply@anthive.local>
# Push the library repo after each upload commit and on `ant sync library`
# (needs a remote and credentials, e.g. a deploy key). Off: commits stay local
# until someone pushes.
library_git_push: false
# Push an uploaded PDF to S3 right away (when s3 is configured). Off by
# default since 2.41.0: the serving process then needs no S3 write key, and
# the PDF goes with the next `ant sync library` (container sites:
# `ant-stack publish-library` from a timer).
library_s3_autopush: false
# This site publishes the literature index to S3 on `ant sync`. Exactly one
# site (the main one) should; the others only pull it as a bootstrap and add
# their local papers.
library_index_publisher: false
# `ant sync` downloads the shared literature index (S3 _library_index/) when
# this site has none or an older one. Set false on a site that builds its own
# index from its own library (`ant lib-index --library ... --out ...`): such a
# site must never receive the index of papers it does not hold. Container
# sites: ant-stack renders false when s3.enabled is false or library.index_pull
# is false in site.yaml.
library_index_pull: true

# Dataset ingestion (doc/DESIGN_dataset_ingestion.md). P1 reads these in
# `ant ingest-check`.
# Largest h5ad accepted, in GB (check files.size); keep it equal to datasets_deposit_max_gb.
datasets_upload_max_gb: 200
# access=public waits for an admin unless this is true.
datasets_auto_publish_public: false
# Access level a new dataset gets when its annotation does not say.
datasets_default_access: internal
# Dataset deposits through the API (doc/DESIGN_dataset_ingestion.md, section
# 22): a signed-in depositor gets presigned upload URLs for exact keys under
# ingest_watch.prefix (no S3 keys of their own), and the S3 watcher checks and
# publishes the deposit. Who may deposit: Remote-Groups of the caller (basic
# auth mode: auth.admins count as "admins"). Anonymous callers never.
datasets_upload_groups:
  - admins
  - curators
# Off by default. Needs S3 credentials that may write the incoming prefix:
# datasets_deposit_s3 (below) or the s3 block. Env: ANTHIVE_DATASETS_DEPOSIT_ENABLED.
datasets_deposit_enabled: false
# Largest deposit (all files together), in GB.
datasets_deposit_max_gb: 200
# Lifetime of a presigned URL; an open deposit expires this long after its last
# URL refresh (uploads aborted, its objects deleted) ...
datasets_deposit_url_ttl_hours: 24
# ... and at the latest this many days after it was created.
datasets_deposit_max_open_days: 7
# Open (not yet completed) deposits per user.
datasets_deposit_max_open_per_user: 5
# Bytes a user may have waiting (uploading, or completed but not yet published), in GB.
datasets_deposit_max_pending_gb_per_user: 400
# Calls that hand out presigned URLs (create, refresh) per user and minute.
datasets_deposit_presign_per_minute: 30
# UploadPart URLs per batch (refresh for more with POST /datasets/deposit/{id}/urls).
datasets_deposit_parts_per_batch: 100
# Files up to this size (MB) are one presigned PUT; larger ones are multipart.
datasets_deposit_single_put_max_mb: 64
# Files per deposit.
datasets_deposit_max_files: 100
# Deposits a user may start in 24 hours.
datasets_deposit_max_per_day: 20
# URL refresh calls per deposit.
datasets_deposit_max_refreshes: 500
# Where presigned uploads land (one folder per deposit), outside ingest_watch.prefix: a URL can never
# write a key the watcher reads. Complete copies the checked files into ingest_watch.prefix.
datasets_deposit_staging_prefix: __deposits/
# Who may deposit a new version of a published dataset: own (the user whose
# deposit published it, and admins) or any (every depositor).
datasets_deposit_update_policy: own
# Optional separate key pair for presigning (endpoint, region and bucket are
# taken from s3 unless given here). Empty: the s3 block's keys.
datasets_deposit_s3: {}

# Where ingestion keeps its state (submissions, reports, overlap indexes).
# Empty: <state_dir>/ingest. Env: ANTHIVE_INGEST_STATE_DIR.
ingest_state_dir: ''
# Overlap indexes of `ant ingest-index`. Empty: <ingest_state_dir>/index.
# Env: ANTHIVE_INGEST_INDEX_DIR.
ingest_index_dir: ''
# Working space of ant-ingest and ant-ingest-watch (pulled uploads, staged
# datasets before they are placed in the store). Empty: <tmp_dir>/ingest_work.
# Env: ANTHIVE_INGEST_WORK_DIR. Put it on the store's filesystem when you can:
# placement then only copies once.
ingest_work_dir: ''

# S3 watch route (doc/DESIGN_dataset_ingestion.md, "S3 watch route"):
# `ant ingest-watch` polls S3 for complete `mus s3 upload` deposits, checks
# them with ant-ingest-check and publishes the clean ones. It runs as its own
# process (config/examples/anthive-ingest-watch.service.example), never inside
# the serving stack. Env overrides: ANTHIVE_INGEST_WATCH_<KEY> (upper case).
ingest_watch:
  # Off by default: `ant ingest-watch` refuses to loop unless this is true
  # (`--once` and `status` always work).
  enabled: false
  # Seconds between two polls of the prefix.
  interval_seconds: 300
  # An upload counts as complete when its h5ad and .h5ad.mus and the static/
  # and de/ files of its project were identical (ETag and size) in two
  # consecutive listings AND the newest of them is at least this many seconds
  # old. The first listing never starts processing.
  settle_seconds: 120
  # S3 prefix that mus writes deposits to.
  prefix: __incoming/
  # Prefix the published files are pushed to ('' = the catalog root, as
  # ant-sync does). Only tests set this.
  catalog_prefix: ''
  # Steps after publication. A failing step is a warning; the dataset stays live.
  # score: ant-score-fleet run --only <db>; gene_stats: ant-gene-stats-precompute
  # --only <db>; module_variability; facet_test; facet_test_modules (results
  # stay uncounted until the dataset is in the cohort table); ingest_index;
  # manifest (S3 _catalog/manifest.json that mus reads).
  post_steps: [score, gene_stats, module_variability, facet_test, facet_test_modules, ingest_index, manifest]
  # A post step still running after this many seconds is stopped and recorded
  # as a warning (ant-score-fleet pauses while the host is busy).
  post_step_timeout_seconds: 21600
  # Commit the dataset's .md, .h5ad.mus and index.md in the store repository.
  store_git_commit: true
  # Push that commit. Off: the commit is recorded and a person pushes.
  store_git_push: false
  # Author of the store commit when the sidecar names no depositor.
  git_identity: 'anthive ingest-watch <noreply@anthive.local>'
  # After a dataset went live and its catalog copy on S3 was verified, delete
  # the objects it consumed from the incoming prefix (only those keys, only
  # when their ETag is still the one that was pulled). `ant ingest prune`
  # handles anything left over.
  delete_incoming_after_ingest: true
  # The delete waits until every post step has run. A post step that failed on
  # its own (not a stop) is a warning; true: the delete happens anyway (recorded
  # as an event); false: the incoming objects stay until a person looks.
  delete_despite_post_warnings: true
  # Base URL of the local ant-serve (empty: api_url / rest_api_host:port).
  api_url: ''
  # Lower the priority of the pipeline's children (nice 19, ionice idle).
  low_priority: true
  # An upload for a dataset that is already published becomes a new version.
  # A sidecar may say which dataset it updates (update_of=<db_id> or
  # previous_sha256=<sha256 of the published h5ad>); a mismatch always stops the
  # item for a person. With true, an update WITHOUT one of these keys stops too
  # (protects against two depositors using the same <group>/<basename>).
  require_update_marker: false
  # Free space (GB) to keep under ingest_work_dir besides 2x the h5ad size;
  # with less the pull waits for the next poll.
  min_free_gb: 50
  # Work dirs of held, failed and needs_decision items are kept this many days
  # (for a look at the staged files), then removed. Live items: removed at once.
  work_ttl_days: 14
  # The watcher refuses to run when its state, tmp or work dir lies inside the
  # repository checkout (runtime writes belong outside it). true allows it.
  allow_repo_dirs: false
  # Process uploads that no API deposit accounts for (lab members' `mus s3 upload`). Dataset preparation and
  # upload move to vark and the deposit API (Mark, 2026-10-15): set false once vark ships, so only deposits
  # made with an Anthive login are published. Objects carrying a deposit's mark that the deposit did not
  # complete are refused either way.
  accept_unlinked: true
  # Optional notification when an item goes live, is held, fails or needs a
  # decision. webhook_url gets a JSON POST; email needs smtp_host and email_to.
  notify:
    on: [live, held, failed, needs_decision]
    webhook_url: ''
    email_to: ''
    email_from: 'anthive-ingest@localhost'
    smtp_host: ''
    smtp_port: 25

# Precomputed literature index (folder holding library_chunks.parquet, built
# by `ant lib-index`, synced via S3). See doc/LIBRARY_INDEX.md.
# Env: ANTHIVE_LIBRARY_INDEX.
library_index: data/library_index

# Where the query-embedding model (fastembed/ONNX) is cached. Empty means
# FASTEMBED_CACHE_PATH if set (the container image bakes the model there),
# else <state_dir>/models. Env: ANTHIVE_MODEL_CACHE.
model_cache: ''

# Persistent per-site state: SQLite caches, click history, MCP link tokens,
# generated secrets. Back this up. Never put it under tmp_dir.
# Env: ANTHIVE_STATE_DIR.
state_dir: var

# Disposable scratch: metadata cache, analytics session parquets, job logs.
# Env: ANTHIVE_TMP_DIR.
tmp_dir: tmp

# Background job logs (precompute runs). null = tmp_dir. Env: ANTHIVE_LOG_DIR.
log_dir: null

# Lowest ant-serve log level that also goes to stderr (the full log is always
# <log_dir>/ant-serve.log). warning keeps the dev supervisor output short (it
# shows stderr next to the file); the container stack renders info so
# `ant-stack logs api` shows the warm-up progress. debug | info | warning |
# error. Env: ANTHIVE_LOG_STDERR_LEVEL.
log_stderr_level: warning

# Static bundle root served by the proxy (jupyter/, plots/, artifacts/).
# Env: ANTHIVE_WEBAPP_DIR.
webapp_dir: webapp

# DuckDB spill directory for ant-serve and ant-convert. null =
# <tmp_dir>/duckdb_spill. Env: ANTHIVE_DUCKDB_TEMP_DIR.
duckdb_temp_directory: null

# Where ant-convert builds a new .duckdb before atomically moving it next to
# the h5ad. null = build in place (next to the target). On HPC set this to
# node-local scratch, e.g. "$TMPDIR": GPFS/Lustre handle DuckDB's small
# writes and file locks badly. If staging and target are on different
# filesystems the final move is a copy followed by a rename.
# Env: ANTHIVE_CONVERT_STAGING_DIR.
convert_staging_dir: null

# Base URL tools (ant-score, ant-convert, fleet scorers) use to reach
# ant-serve for the release/restore handshake. null =
# http://localhost:<rest_api_port>. Env: ANTHIVE_API_URL.
api_url: null

# Do duckdb writers coordinate with a running ant-serve?
#   auto   try the handshake; skip quietly when no server answers (HPC)
#   always an unreachable server is an error
#   never  skip the handshake (only when no server has the files open)
# Env: ANTHIVE_COORDINATE.
coordinate: auto

# Catalog scan: local = only datasets with a local .duckdb; s3 = also list
# the bucket for S3-only datasets; auto = s3 when s3.bucket is set.
# Env: ANTHIVE_CATALOG_SCAN.
catalog_scan: auto

# In-memory rendered-plot LRU size (entries) in ant-serve.
plot_cache_max_entries: 256

# Authentication model, set per deployment (containers set it from site.yaml).
#   authelia       Caddy forward_auth against Authelia; Remote-* headers from it
#   basic          Caddy basic_auth; Remote-User = the basic user, admins below
#   trusted-proxy  an upstream proxy (nginx + SSO) already set Remote-* headers
#   none           no login at all; admin features are disabled
# null = not declared (legacy installs; identity comes from proxy headers).
# Env: ANTHIVE_AUTH_MODE.
auth:
  mode: null
  # Users treated as admins when the proxy sends no Remote-Groups (basic mode).
  admins: []

# Datasets whose annotation is not `access: public` (internal, or no access
# value at all) are served only to callers with an authenticated identity
# (Remote-User from the proxy; ignored on auth.mode none), local maintenance
# tools and tools holding the internal secret. Anonymous callers do not see
# them in any listing and get 404 on their routes. false serves every dataset
# to everyone who can reach the API (only for a site whose whole store may be
# public). Env: ANTHIVE_INTERNAL_REQUIRES_AUTH (true/false).
internal_requires_auth: true

# Background cache warm-up of ant-serve after every start (low CPU priority,
# never blocks /health; a request that arrives first builds what it needs).
#   enabled          false skips it. Env ANTHIVE_WARMUP (ANTHIVE_FACET_WARMUP=0
#                    also turns it off).
#   anonymous        also build the facet caches an anonymous caller uses when
#                    internal datasets are hidden from them (they are keyed by
#                    the datasets a caller sees). Signed-in caches are skipped
#                    on auth.mode none (nobody signs in there).
#   donor_genes      genes whose per-donor values are computed for every facet
#                    in donor_cell_type: opens the sidecars and datasets the
#                    first donor plot needs. [] skips it.
#   module_ranks     all: rank tables (/genesets/.../rank, /databases/{id}/
#                    module-ranks) of every dataset with a score sidecar, the
#                    module_rank_datasets first; priority: only those; off.
#                    A table is read from <tmp_dir>/module_rank when it is
#                    there, else built from the sidecar (up to a minute each).
#   workers          rank tables built at once by the warm-up (1 or 2; the
#                    server builds at most 2 at once, so 1 leaves one for
#                    requests).
#   pause_seconds    pause between two warm-up items.
warmup:
  enabled: true
  anonymous: true
  donor_genes: [TREM2]
  donor_cell_type: microglia
  module_ranks: all
  module_rank_datasets: []
  workers: 1
  pause_seconds: 0.5

# DuckDB resource limits for ant-convert (ingest).
duckdb_memory_limit: auto
duckdb_threads: 2

# DuckDB resource limits for ant-serve. Each served dataset gets its own
# DuckDB instance; these apply per instance.
# duckdb_server_threads: worker threads per dataset instance. 8 measured
#   ~8x faster than 2 on a full-layer aggregate (L26/FMG) with 16 only 1.6x
#   better again; every open instance starts threads-1 OS threads.
# duckdb_server_memory_limit: "auto" = 25% of RAM capped at 16 GB.
# duckdb_max_open_databases: LRU cap on simultaneously open instances.
# duckdb_allowed_directories: extra directories queries may read (the data
#   folder and each dataset's own directory are always allowed).
duckdb_server_threads: 8
duckdb_server_memory_limit: auto
duckdb_max_open_databases: 48
duckdb_allowed_directories: []

# Shared secret ant-mcp sends (X-Anthive-Internal) when it calls ant-serve
# on behalf of a verified user. null = env ANTHIVE_INTERNAL_SECRET, else
# <state_dir>/secrets/internal_secret (auto-created, mode 0600).
internal_secret: null

# S3-compatible storage for DuckDB files (optional)
# If bucket is set and a local .duckdb is not found, ant-serve will attempt
# to open the .duckdb from S3 at the equivalent relative path.
s3:
  # S3 endpoint URL. Leave null for AWS S3.
  # For MinIO / Cloudflare R2 / etc: https://my-minio.example.com:9000
  endpoint: null

  # AWS region (used for AWS S3; can be any string for non-AWS)
  region: us-east-1

  # Credentials (leave null for anonymous/IAM access)
  access_key_id: null
  secret_access_key: null

  # Bucket name (required to enable S3 fallback)
  bucket: null

  # Optional path prefix inside the bucket, e.g. "h5adstore"
  # The final S3 path is: s3://<bucket>/<prefix>/<relative_duckdb_path>
  prefix: ""

  # Set true for MinIO / path-style endpoints (s3://bucket/key)
  # Set false (default) for AWS-style virtual-hosted (bucket.s3.region.amazonaws.com)
  use_path_style: false

# MCP Server Configuration (ant-mcp)
# ------------------------------------
mcp:
  # Host and port ant-mcp listens on. Keep it on loopback: public access
  # goes through Caddy's /mcp route, which applies the auth snippet.
  host: 127.0.0.1
  port: 8090

  # MCP transport: streamable-http | sse | stdio
  transport: streamable-http

  # Directory where plot PNG files are saved for URL-based serving.
  # Set to null to disable file-based plots (falls back to data: URIs).
  plots_dir: ./webapp/plots

  # Public base URL used to construct plot image URLs and the API links
  # tools print (<public_url>/api/..., e.g. donor plots)
  # (scheme + host only, no trailing slash)
  public_url: http://localhost:8501

  # Public-facing MCP URL shown at startup (informational only; users get
  # their own personal link from the web UI). Defaults to
  # http://<host>:<port>/mcp when null.
  mcp_url: null

  # ── Personal MCP links ──────────────────────────────────────────────
  # Every signed-in user can get ONE personal link
  # (<public_base_url>/mcp/u/<token>) from the web UI and rotate or revoke
  # it at any time. The token is derived from a server secret, so the
  # database alone never reveals a working link.
  #
  # enabled: false hides the feature in the UI and refuses new links.
  enabled: true
  # require_token: false keeps the legacy unauthenticated /mcp endpoint
  # (only sensible when ant-mcp is reachable from localhost alone).
  require_token: true
  # Days until a link expires; 0 = never. Rotating resets the clock.
  token_ttl_days: 90
  # Scheme + host users' MCP clients reach this site at, e.g.
  # https://anthive.example.org. null = derive from the request
  # (X-Forwarded-Proto / X-Forwarded-Host set by the reverse proxy).
  public_base_url: null
  # Per-link request budget in ant-mcp (requests per minute).
  rate_limit_per_minute: 120
  # How many named links one user may hold at the same time.
  max_links_per_user: 5
  # Largest PDF the MCP upload_paper tool accepts (base64 in the tool call),
  # in MB. The API's own limit is library_upload_max_pdf_mb.
  max_upload_mb: 25
  # ant-mcp caches a successful token check this many seconds, a failed
  # one verify_negative_cache_seconds. Rotation/revocation takes effect
  # after at most verify_cache_seconds.
  verify_cache_seconds: 30
  verify_negative_cache_seconds: 5
  # HMAC secret the tokens derive from. null = env
  # ANTHIVE_MCP_TOKEN_SECRET, else <state_dir>/secrets/mcp_token_secret
  # (auto-created, mode 0600). Changing it invalidates every link.
  token_secret: null

# S3 sync policy — what to pull locally, how to cap the local store
# -----------------------------------------------------------------
# The h5adstore is canonical on S3. ``ant-sync pull`` decides what to
# copy locally per the policy below. Use the priority knob in each .md
# (``priority: 0..100``) to drive eviction order under the cap.
#
# mode:
#   priority  → pull duckdbs respecting per-dataset priority + caps
#               (the production-disk case). h5ads are NOT pulled.
#   duckdb    → pull ALL duckdbs (ignore priority); h5ads still skipped
#   all       → pull h5ads + duckdbs (legacy; effectively unbounded)
#
# Caps (only consulted in mode: priority). Whichever is tighter wins.
# Either or both can be null to disable that cap:
#   max_local_gb   → hard upper bound on (h5ad + duckdb) bytes locally
#   min_free_space → keep at least this many GB free on the h5adstore
#                    filesystem after the pull. Reactive: a high-priority
#                    pull that doesn't fit triggers eviction of lower-
#                    priority duckdbs to make room (sync-pull-evict).
#
# priority_default → priority used when an .md has no `priority:` key.
#                    50 by default — middle of the range, evictable.
#
# role:
#   primary  → normal full-control deployment (default). Pushes to S3,
#              annotation writes allowed, priority edits allowed.
#   slave    → read-only mirror. NEVER pushes. Annotation writes
#              (ant-score, ant-starcat, ant-annotate, ant-merge-h5ad,
#              ant-de-ingest, ant-convert, make ingest) refuse with a
#              clear error. ant-priority set refuses. sync-pull
#              force-overwrites any local drift — incoming always wins.
#              git operations on the h5adstore repo are NOT touched by
#              this flag (handled outside ant-sync's scope).
#   Always explicit: an unset/null role behaves as 'primary'. There is
#   no auto-detection — slaves must opt in via anthive.yaml.
#
# TODO: add `min_priority` (hard floor — datasets with priority < N
# are NEVER pulled, regardless of available disk). Today the same
# effect is achieved by setting those datasets to `priority: 0` in
# their .md, which is already gated as "inactive, never pulled".
# min_priority would give a cleaner declarative cutoff for "I want
# 10s to never come back even if there's plenty of room".
sync_policy:
  mode: all
  role: primary
  max_local_gb: null
  min_free_space: 84    # GB (= 2 × 42) — sane floor for OS / logs / tmp /
                        # plot cache / analytics session parquets / DuckDB
                        # spill. Only consulted under mode='priority';
                        # harmless in other modes.
  priority_default: 50

# Geneset store (curated gene sets / ranked lists tied to studies)
# ----------------------------------------------------------------
# Path to the geneset store root. Default is `data/genesetstore`
# (typically a symlink to a separate git repo). Set to null to
# disable geneset features.
geneset_store: data/genesetstore

# Static report sites pulled from git repositories
# Each entry is served at /report/<slug>/ as a static website.
# Run `make build-reports` to pull/update all.
reports: []
  # - name: Microglia States          # display name in navigation
  #   repo: git@github.com:badslab/microglia_states.git
  #   build: quarto                   # "quarto" | "mkdocs" | "static"
  #   slug: microglia-states          # URL slug: /report/microglia-states/
  #   folder: doc                     # for quarto: input dir (default "doc"); for static: output subfolder
  #   bib: doc/literature/refs.bib    # optional: path to .bib file (quarto auto-detects common locations)

# In-app chat assistant (ant-serve /api/chat/*)
# ---------------------------------------------
# Three-state gate:
#   enabled=false                → widget OFF (catalog never advertises chat)
#   enabled=true + no api_key     → silently OFF + one-line warning at startup
#   enabled=true + api_key        → ON
chat:
  # Master switch. Default false — opt in via this key in anthive.yaml.
  enabled: false

  # OpenRouter (or any OpenAI-compatible) API key. Put the real key ONLY in
  # the gitignored anthive.yaml — never here. Env var OPENROUTER_API_KEY is
  # an optional override; this yaml field is the canonical source.
  api_key: null

  # Model identifier passed to the OpenAI-compatible endpoint. This is
  # the DEFAULT; users can pick any entry from allowed_models below at
  # runtime via the chat widget. Strong tool-calling reliability matters
  # more than cost for this low-traffic internal feature.
  model: anthropic/claude-opus-4

  # Models the user picker exposes. Each entry must specify id (the
  # OpenAI-compatible model identifier), label (display string in the
  # picker), provider (display group), and tier ('top' or 'sub-top').
  # Curated from openrouter.ai/api/v1/models, 2026-06; all support
  # streaming chat completions + tool-calls. Prices are per million
  # tokens (input / output) at the time of curation — comments only,
  # OpenRouter is the live billing source.
  allowed_models:
    # Top tier — strongest tool-calling per provider
    - {id: anthropic/claude-opus-4.8,    label: Claude Opus 4.8,     provider: Anthropic, tier: top}      # $5 / $25
    - {id: openai/gpt-4.1,               label: GPT-4.1,             provider: OpenAI,    tier: top}      # $2 / $8
    - {id: google/gemini-2.5-pro,        label: Gemini 2.5 Pro,      provider: Google,    tier: top}      # $1.25 / $10
    - {id: deepseek/deepseek-v4-pro,     label: DeepSeek V4 Pro,     provider: DeepSeek,  tier: top}      # $0.43 / $0.87
    - {id: z-ai/glm-5.2,                 label: GLM 5.2,             provider: Zhipu,     tier: top}      # $0.95 / $3
    # Sub-top tier — cheaper / faster, still capable of clean tool calls
    - {id: anthropic/claude-sonnet-4.5,  label: Claude Sonnet 4.5,   provider: Anthropic, tier: sub-top}  # $3 / $15
    - {id: openai/gpt-4.1-mini,          label: GPT-4.1 Mini,        provider: OpenAI,    tier: sub-top}  # $0.40 / $1.60
    - {id: google/gemini-2.5-flash,      label: Gemini 2.5 Flash,    provider: Google,    tier: sub-top}  # $0.30 / $2.50
    - {id: deepseek/deepseek-v4-flash,   label: DeepSeek V4 Flash,   provider: DeepSeek,  tier: sub-top}  # $0.09 / $0.18
    - {id: z-ai/glm-4.7,                 label: GLM 4.7,             provider: Zhipu,     tier: sub-top}  # $0.40 / $1.75

  # OpenRouter routes Anthropic models through multiple upstream
  # providers (Anthropic-direct, AWS Bedrock, Google Vertex AI). When
  # Vertex AI is throttled, requests 429 even on a paid OpenRouter
  # account. Pin the order so Anthropic-direct (then Bedrock) is tried
  # first; non-Anthropic models ignore this and use OpenRouter's default
  # routing. Leave as null / omit to keep OpenRouter's defaults.
  provider_order: ["Anthropic", "Amazon Bedrock"]

  # Base URL of the OpenAI-compatible chat-completions API. OpenRouter is
  # the default; any compatible provider works (e.g. directly anthropic.com
  # via their OpenAI-compatible endpoint, or a self-hosted proxy).
  base_url: https://openrouter.ai/api/v1

  # Persistent SQLite path for chat history, keyed on (Remote-User,
  # session_id). Must survive tmp/ cleans + ant-serve restarts.
  history_path: data/chat_history.db

# Grist sync (bin/meta/ant-grist).
# API key is read from GRIST_API_KEY env var — never put the token here.
grist:
  url: null                    # e.g. https://grist.fie.rs
  doc_id: null                 # e.g. 6dMbv7Qi9Zy8
  table: null                  # e.g. Micro_v8

# Where the "Report an issue" entry in the web UI's user menu points
# (opens in a new tab). An empty string hides the entry.
issue_tracker_url: https://gitlab.kuleuven.be/bdslab/anthive/anthive4/-/issues

# Facets shown on the /facets pages and in the dataset page's facet card.
# Temporary: while the facet audit decisions are pending, only the facets the
# replicate-level facet tests analyse are shown. Other ant_* columns stay in the
# data, SQL, plots and API listings (the /facets API marks them
# hidden_by_config). An empty list or null shows every facet.
# Env: ANTHIVE_FACETS_VISIBLE (comma separated, "*" for all).
facets_visible: [ant_sex, ant_disease, ant_apoe4_carrier, ant_braak, ant_age, ant_app_nlgf]

# Folder the in-app help links to for detailed docs (doc/MCP_CLIENTS.md,
# doc/MCP_LINKS.md, ...). They live in the repo so they can be corrected
# without a release. Env: ANTHIVE_DOCS_BASE_URL. Empty means this default.
docs_base_url: https://gitlab.kuleuven.be/bdslab/anthive/anthive4/-/blob/main/doc

# GENCODE gene annotation (GTF with gene lines) used to flag sex-chromosome and long (> 500 kb) genes in the facet
# result views. null: the ANTHIVE_GENE_GTF environment variable, else no span or chromosome flags (name based flags
# remain). Read only.
gene_annotation_gtf: null
