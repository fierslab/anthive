<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — page not found · anthive</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #fafafa;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 4rem 1.5rem 3rem;
    text-align: center;
  }
  img.hero {
    max-width: 380px;
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 1.5rem;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    margin: 0 0 0.5rem;
    letter-spacing: 0.01em;
  }
  p {
    font-size: 0.95rem;
    color: #555;
    margin: 0.25rem 0;
    line-height: 1.5;
  }
  .path {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    color: #444;
    background: #eee;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    display: inline-block;
    margin-top: 0.4rem;
    word-break: break-all;
  }
  nav {
    margin-top: 2rem;
    font-size: 0.9rem;
  }
  nav a {
    color: #444;
    text-decoration: none;
    border-bottom: 1px solid #bbb;
    margin: 0 0.6rem;
  }
  nav a:hover {
    color: #000;
    border-bottom-color: #000;
  }
</style>
</head>
<body>
<main>
  <img class="hero" src="/anthive404.png" alt="Cartoon lab-coat ant with a magnifying glass, examining a suspicious lump. Caption: 404 — page not found." />
  <h1>Nothing here</h1>
  <p>The path you asked for wasn't found on this anthive instance.</p>
  <p><span class="path" id="path"></span></p>
  <nav>
    <a href="/">home</a>
    <a href="/browse">datasets</a>
    <a href="/genesets">genesets</a>
  </nav>
</main>
<script>
  // Show the failing path (best-effort — script is optional, page renders fine without it).
  try {
    var p = window.location.pathname + window.location.search;
    if (p && p !== '/') document.getElementById('path').textContent = p;
  } catch (e) { /* ignore */ }
</script>
</body>
</html>
